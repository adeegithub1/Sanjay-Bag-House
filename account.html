<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>
<main class="container">
  <nav class="breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><span class="current">My Account</span></nav>
  <div class="account-layout">
    <div id="accountNavWrap"></div>
    <div>
      <h1 class="section-heading" style="margin-bottom:18px;">My Profile</h1>
      <div class="card" style="padding:24px;margin-bottom:20px;">
        <form id="profileForm">
          <div class="form-row form-row-2">
            <div class="form-group"><label class="form-label">Full Name</label><input id="profName" class="form-input" /></div>
            <div class="form-group"><label class="form-label">Mobile Number</label><input id="profPhone" class="form-input" /></div>
          </div>
          <div class="form-group"><label class="form-label">Email Address</label><input id="profEmail" class="form-input" disabled title="Email can't be changed here" /></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <div id="addresses">
        <h2 class="section-heading" style="font-size:19px;margin-bottom:14px;">Saved Addresses</h2>
        <div class="card" style="padding:20px;margin-bottom:12px;">
          <div class="flex justify-between">
            <div>
              <span class="badge badge-neutral" style="margin-bottom:8px;">Home</span>
              <p class="body-text">Priya Sharma, 24 MG Road, Andheri West</p>
              <p class="caption-text">Mumbai, Maharashtra 400001 · 98765 43210</p>
            </div>
            <div class="flex gap-8" style="align-self:flex-start;">
              <button class="btn btn-ghost btn-sm" onclick="showToast('Address updated')">Edit</button>
              <button class="btn btn-ghost btn-sm" onclick="showToast('Address removed')">Remove</button>
            </div>
          </div>
        </div>
        <button class="btn btn-secondary" onclick="showToast('Address form would open here')">+ Add New Address</button>
      </div>
    </div>
  </div>
</main>
<div id="sbh-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script src="/js/account-nav.js"></script>
<script>
SBHComponents.init('');
document.getElementById('accountNavWrap').innerHTML = renderAccountNav('profile');
wireAccountNavLogout();
</script>
<script type="module">
  import SBHAuth from "/js/auth.js";

  const user = await SBHAuth.getCurrentUser();
  if (!user) {
    window.location.href = "/login.html?next=" + encodeURIComponent(location.pathname);
  } else {
    const profile = await SBHAuth.getCustomerProfile(user.uid);
    document.getElementById('profName').value = profile?.name || user.displayName || '';
    document.getElementById('profPhone').value = profile?.phone || '';
    document.getElementById('profEmail').value = user.email || '';

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
      const { db } = await import("/js/firebase-init.js");
      try {
        await updateDoc(doc(db, "customers", user.uid), {
          name: document.getElementById('profName').value.trim(),
          phone: document.getElementById('profPhone').value.trim(),
        });
        showToast('Profile updated successfully', 'success');
      } catch (err) {
        showToast('Could not update profile. Please try again.', 'error');
      }
    });
  }
</script>
</body>
</html>
