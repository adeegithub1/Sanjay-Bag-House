<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categories | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
<style>html:not(.admin-authed) .admin-shell{display:none}</style>
</head>
<body class="admin-body">
<script type="module" src="/js/admin-guard.js"></script>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div><h1>Categories</h1><p>Organize how products are grouped in your store.</p></div>
        <button class="btn btn-primary" onclick="openCatModal()">+ Add Category</button>
      </div>
      <div class="admin-panel">
        <div class="dt-wrap">
          <table class="data-table">
            <thead><tr><th>Image</th><th>Name</th><th>Products</th><th>Status</th><th>Sort Order</th><th>Actions</th></tr></thead>
            <tbody id="catBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="catModalTitle">Add Category</h3><button class="icon-btn" onclick="closeCatModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Category Name</label><input class="form-input" id="catNameInput" placeholder="e.g. Backpacks" /></div>
      <div class="form-group"><label class="form-label">Sort Order</label><input type="number" class="form-input" id="catSortInput" value="1" /></div>
      <div class="flex justify-between items-center"><span class="body-text">Active</span><label class="toggle"><input type="checkbox" id="catActiveInput" checked/><span class="toggle-slider"></span></label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeCatModal()">Cancel</button><button class="btn btn-primary" onclick="saveCategory()">Save Category</button></div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
AdminShell.init('categories', 'Categories');
const data = window.SBH_DATA;
let cats = data.CATEGORIES.map((c,i) => ({...c, active: true, sort: i+1}));

function render() {
  document.getElementById('catBody').innerHTML = cats.map(c => `
    <tr>
      <td><img src="${c.image}" alt="${c.name}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;" /></td>
      <td><strong>${c.name}</strong></td>
      <td>${c.count} products</td>
      <td><span class="badge badge-${c.active ? 'success' : 'neutral'}">${c.active ? 'Active' : 'Disabled'}</span></td>
      <td>${c.sort}</td>
      <td>
        <div class="row-actions">
          <button aria-label="Edit" onclick="showToast('Category updated','success')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/></svg></button>
          <button aria-label="Toggle status" onclick="toggleCat('${c.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg></button>
          <button aria-label="Delete" style="color:var(--color-danger);" onclick="deleteCat('${c.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </td>
    </tr>`).join('');
}
window.toggleCat = function(id) { const c = cats.find(x=>x.id===id); c.active = !c.active; showToast('Category status updated','success'); render(); };
window.deleteCat = function(id) { showConfirmDialog('Delete this category? Products inside it will remain uncategorized.', () => { cats = cats.filter(c=>c.id!==id); showToast('Category deleted','success'); render(); }); };
window.openCatModal = function() { document.getElementById('catModal').classList.add('open'); };
window.closeCatModal = function() { document.getElementById('catModal').classList.remove('open'); };
window.saveCategory = function() {
  const name = document.getElementById('catNameInput').value.trim();
  if (!name) { showToast('Please enter a category name','error'); return; }
  cats.push({ id: 'cat-'+Date.now(), name, image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=200&h=200&fit=crop', count: 0, active: document.getElementById('catActiveInput').checked, sort: Number(document.getElementById('catSortInput').value) });
  closeCatModal();
  showToast('Category added successfully','success');
  render();
};
render();
</script>
</body>
</html>
