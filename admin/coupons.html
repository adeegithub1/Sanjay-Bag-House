<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coupons | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div><h1>Coupons</h1><p>Create and manage discount codes.</p></div>
        <button class="btn btn-primary" onclick="openCouponModal()">+ Add Coupon</button>
      </div>

      <div class="admin-panel">
        <div class="dt-wrap">
          <table class="data-table">
            <thead><tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Usage</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="couponBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="couponModal">
  <div class="modal-box wide">
    <div class="modal-head"><h3>Add Coupon</h3><button class="icon-btn" onclick="closeCouponModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Coupon Code</label><input class="form-input" id="cc_code" placeholder="e.g. FESTIVE20" /></div>
        <div class="form-group"><label class="form-label">Discount Type</label><select class="form-select" id="cc_type"><option>Percentage</option><option>Flat</option></select></div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Discount Value</label><input type="number" class="form-input" id="cc_value" placeholder="e.g. 20" /></div>
        <div class="form-group"><label class="form-label">Maximum Discount (₹)</label><input type="number" class="form-input" id="cc_max" placeholder="e.g. 500" /></div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Minimum Order (₹)</label><input type="number" class="form-input" id="cc_min" placeholder="e.g. 999" /></div>
        <div class="form-group"><label class="form-label">Usage Limit</label><input type="number" class="form-input" id="cc_usage" placeholder="e.g. 300" /></div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Start Date</label><input type="date" class="form-input" id="cc_start" /></div>
        <div class="form-group"><label class="form-label">End Date</label><input type="date" class="form-input" id="cc_end" /></div>
      </div>
      <div class="form-group"><label class="form-label">Per User Limit</label><input type="number" class="form-input" id="cc_peruser" value="1" /></div>
      <div class="flex justify-between items-center"><span class="body-text">Active</span><label class="toggle"><input type="checkbox" id="cc_active" checked/><span class="toggle-slider"></span></label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeCouponModal()">Cancel</button><button class="btn btn-primary" onclick="saveCoupon()">Save Coupon</button></div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
AdminShell.init('coupons', 'Coupons');
const data = window.SBH_DATA;
let coupons = data.COUPONS.map(c => ({...c}));

function render() {
  document.getElementById('couponBody').innerHTML = coupons.map(c => `
    <tr>
      <td><strong>${c.code}</strong></td>
      <td>${c.type === 'Percentage' ? c.value + '% OFF' : data.formatINR(c.value) + ' OFF'}</td>
      <td>${data.formatINR(c.minOrder)}</td>
      <td>${c.used} / ${c.usageLimit}</td>
      <td>${c.end}</td>
      <td><span class="badge badge-${c.active ? 'success' : 'neutral'}">${c.active ? 'Active' : 'Inactive'}</span></td>
      <td>
        <div class="row-actions">
          <button aria-label="Toggle" onclick="toggleCoupon('${c.code}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg></button>
          <button aria-label="Delete" style="color:var(--color-danger);" onclick="deleteCoupon('${c.code}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </td>
    </tr>`).join('');
}
window.toggleCoupon = function(code) { const c = coupons.find(x=>x.code===code); c.active = !c.active; showToast('Coupon status updated','success'); render(); };
window.deleteCoupon = function(code) { showConfirmDialog('Delete this coupon? It will no longer be usable at checkout.', () => { coupons = coupons.filter(c=>c.code!==code); showToast('Coupon deleted','success'); render(); }); };
window.openCouponModal = function() { document.getElementById('couponModal').classList.add('open'); };
window.closeCouponModal = function() { document.getElementById('couponModal').classList.remove('open'); };
window.saveCoupon = function() {
  const code = document.getElementById('cc_code').value.trim().toUpperCase();
  if (!code) { showToast('Please enter a coupon code','error'); return; }
  coupons.push({
    code, type: document.getElementById('cc_type').value, value: Number(document.getElementById('cc_value').value)||0,
    maxDiscount: Number(document.getElementById('cc_max').value)||0, minOrder: Number(document.getElementById('cc_min').value)||0,
    usageLimit: Number(document.getElementById('cc_usage').value)||0, used: 0,
    start: document.getElementById('cc_start').value, end: document.getElementById('cc_end').value,
    perUser: Number(document.getElementById('cc_peruser').value)||1, active: document.getElementById('cc_active').checked,
  });
  closeCouponModal();
  showToast('Coupon created successfully','success');
  render();
};
render();
</script>
</body>
</html>
