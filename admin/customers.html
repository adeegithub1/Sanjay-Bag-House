<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customers | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
<style>html:not(.admin-authed) .admin-shell{display:none}</style>
</head>
<body class="admin-body">
<script type="module" src="/js/admin-guard.js"></script>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head"><div><h1>Customers</h1><p>View and manage your customer base.</p></div></div>

      <div class="admin-toolbar">
        <div class="admin-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="cSearch" placeholder="Search by name or email..." />
        </div>
      </div>

      <div class="admin-panel">
        <div class="dt-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th>Status</th><th></th></tr></thead>
            <tbody id="custBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Customer detail drawer -->
<div class="drawer-overlay" id="custDrawerOverlay" onclick="closeCustDrawer()"></div>
<div class="drawer drawer-right" id="custDrawer" style="max-width:420px;">
  <div class="drawer-header"><strong>Customer Details</strong><button class="icon-btn" onclick="closeCustDrawer()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div style="padding:20px;" id="custDrawerBody"></div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
AdminShell.init('customers', 'Customers');
const data = window.SBH_DATA;

function render() {
  const q = document.getElementById('cSearch').value.toLowerCase();
  const list = data.CUSTOMERS.filter(c => (c.name + c.email).toLowerCase().includes(q));
  document.getElementById('custBody').innerHTML = list.map(c => `
    <tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${c.orders}</td>
      <td>${data.formatINR(c.totalSpent)}</td>
      <td>${c.joined}</td>
      <td><span class="badge badge-${c.status==='Active'?'success':'neutral'}">${c.status}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openCustDrawer('${c.id}')">View</button></td>
    </tr>`).join('');
}

window.openCustDrawer = function(id) {
  const c = data.CUSTOMERS.find(x=>x.id===id);
  const custOrders = data.ORDERS.filter(o => o.customer === c.name);
  document.getElementById('custDrawerBody').innerHTML = `
    <div class="flex items-center gap-8" style="margin-bottom:18px;">
      <div class="admin-avatar" style="width:48px;height:48px;font-size:16px;">${c.name.split(' ').map(n=>n[0]).join('')}</div>
      <div><strong style="font-size:15px;">${c.name}</strong><div class="caption-text">${c.status}</div></div>
    </div>
    <div class="form-group"><label class="form-label">Email</label><p class="body-text">${c.email}</p></div>
    <div class="form-group"><label class="form-label">Phone</label><p class="body-text">${c.phone}</p></div>
    <div class="form-group"><label class="form-label">Location</label><p class="body-text">${c.city}, ${c.state}</p></div>
    <div class="form-row form-row-2" style="margin-bottom:20px;">
      <div class="stat-card"><div class="value" style="font-size:17px;">${c.orders}</div><div class="label">Total Orders</div></div>
      <div class="stat-card"><div class="value" style="font-size:17px;">${data.formatINR(c.totalSpent)}</div><div class="label">Total Spent</div></div>
    </div>
    <h4 style="font-size:13px;font-weight:700;margin-bottom:10px;">Recent Orders</h4>
    ${custOrders.length ? custOrders.slice(0,4).map(o => `<div class="flex justify-between" style="padding:9px 0;border-bottom:1px solid var(--color-border);font-size:13px;"><span>${o.id}</span><span class="text-muted">${data.formatINR(o.total)}</span></div>`).join('') : '<p class="text-muted" style="font-size:13px;">No orders yet.</p>'}
  `;
  document.getElementById('custDrawer').classList.add('open');
  document.getElementById('custDrawerOverlay').classList.add('open');
};
window.closeCustDrawer = function() { document.getElementById('custDrawer').classList.remove('open'); document.getElementById('custDrawerOverlay').classList.remove('open'); };

document.getElementById('cSearch').addEventListener('input', render);
render();
</script>
</body>
</html>
