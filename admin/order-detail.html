<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Detail | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
<style>html:not(.admin-authed) .admin-shell{display:none}</style>
</head>
<body class="admin-body">
<script type="module" src="/js/admin-guard.js"></script>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div><h1 id="orderTitle">Order</h1><p><a href="/admin/orders.html" style="color:var(--color-accent);">← Back to Orders</a></p></div>
        <div class="flex gap-8 items-center">
          <select class="admin-select" id="statusSelect"></select>
          <button class="btn btn-primary btn-sm" onclick="updateStatus()">Update Status</button>
        </div>
      </div>

      <div class="pdp-grid" style="grid-template-columns:1.6fr 1fr;gap:20px;">
        <div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h3>Products Ordered</h3></div>
            <div class="dt-wrap">
              <table class="data-table">
                <thead><tr><th>Image</th><th>Product</th><th>SKU</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
                <tbody id="itemsBody"></tbody>
              </table>
            </div>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h3>Order Timeline</h3></div>
            <div class="admin-panel-body"><div class="order-timeline" id="timelineWrap"></div></div>
          </div>
        </div>
        <div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h3>Customer Information</h3></div>
            <div class="admin-panel-body" id="custInfo"></div>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h3>Shipping Address</h3></div>
            <div class="admin-panel-body" id="shipInfo"></div>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h3>Payment Summary</h3></div>
            <div class="admin-panel-body" id="paySummary"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script type="module" src="/js/admin-orders.js"></script>
<script type="module">
(async () => {
  AdminShell.init('orders', 'Order Detail');

  function formatINR(n) { return "₹" + (n||0).toLocaleString("en-IN"); }
  function formatDate(ts) { return ts?.toDate ? ts.toDate().toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—'; }

  const id = new URLSearchParams(window.location.search).get('id');
  const o = await window.AdminOrders.getOne(id);

  if (!o) {
    document.getElementById('orderTitle').textContent = 'Order not found';
    return;
  }

  document.getElementById('orderTitle').textContent = 'Order #' + o.id.slice(0,8).toUpperCase();

  document.getElementById('statusSelect').innerHTML = window.SBH_STATUS_OPTIONS.map(s => `<option value="${s.value}" ${s.value===o.status?'selected':''}>${s.label}</option>`).join('');

  document.getElementById('itemsBody').innerHTML = o.items.map(i => `
    <tr><td><img src="${i.image}" alt="${i.name}" style="width:44px;height:44px;border-radius:6px;object-fit:cover;"/></td><td>${i.name}</td><td>${i.sku}</td><td>${i.qty}</td><td>${formatINR(i.price)}</td><td>${formatINR(i.lineTotal || i.price*i.qty)}</td></tr>`).join('');

  document.getElementById('custInfo').innerHTML = `<p class="body-text" style="margin-bottom:4px;"><strong>${o.address?.name || '—'}</strong></p><p class="text-muted" style="font-size:13px;">📞 ${o.address?.phone || '—'}</p><p class="text-muted" style="font-size:13px;">✉️ ${o.customerEmail || '—'}</p>`;
  document.getElementById('shipInfo').innerHTML = `<p class="body-text">${o.address?.line1 || ''}${o.address?.line2 ? ', ' + o.address.line2 : ''}</p><p class="text-muted" style="font-size:13px;">${o.address?.city || ''}, ${o.address?.state || ''} ${o.address?.pincode || ''}</p>`;
  document.getElementById('paySummary').innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span>${formatINR(o.subtotal)}</span></div>
    <div class="summary-row"><span>Shipping</span><span>${o.shipping===0?'FREE':formatINR(o.shipping)}</span></div>
    <div class="summary-row total"><span>Total</span><span>${formatINR(o.total)}</span></div>
    <p class="caption-text" style="margin-top:10px;">Payment Method: <strong>Cash on Delivery</strong></p>`;

  const STEPS = ["pending","confirmed","processing","packed","shipped","delivered"];
  function renderTimeline() {
    const idx = STEPS.includes(o.status) ? STEPS.indexOf(o.status) : (o.status === 'cancelled' || o.status === 'returned' || o.status === 'refunded' ? 0 : 5);
    document.getElementById('timelineWrap').innerHTML = STEPS.map((s,i) => `
      <div class="timeline-step ${i<=idx?'done':''}"><div class="t-title">${window.SBH_statusLabel(s)}</div><div class="t-date">${i<=idx ? formatDate(o.createdAt) : 'Pending'}</div></div>`).join('');
  }
  renderTimeline();

  window.updateStatus = async function() {
    const newStatus = document.getElementById('statusSelect').value;
    try {
      await window.AdminOrders.updateStatus(o.id, newStatus);
      o.status = newStatus;
      showToast('Order status updated successfully', 'success');
      renderTimeline();
    } catch (err) {
      showToast('Could not update order status. Please try again.', 'error');
    }
  };
})();
</script>
</body>
</html>
