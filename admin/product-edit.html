<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Product | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div><h1 id="formTitle">Edit Product</h1><p>Update the details for this product.</p></div>
      </div>

      <form id="productForm">
        <div class="admin-form-grid">
          <div>
            <div class="form-section">
              <h3>Product Images</h3>
              <p class="desc">Upload up to 6 images. The first image will be used as the primary display image.</p>
              <div class="image-uploader" id="imageUploader"></div>
            </div>

            <div class="form-section">
              <h3>Basic Information</h3>
              <div class="form-group"><label class="form-label">Product Name <span class="req">*</span></label><input required class="form-input" id="f_name" placeholder="e.g. Urban Laptop Backpack" /></div>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">SKU <span class="req">*</span></label><input required class="form-input" id="f_sku" placeholder="e.g. SBH-BP-106" /></div>
                <div class="form-group"><label class="form-label">Brand</label><input class="form-input" id="f_brand" value="Sanjay Bag House" /></div>
              </div>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">Category <span class="req">*</span></label>
                  <select required class="form-select" id="f_category"></select>
                </div>
                <div class="form-group"><label class="form-label">Subcategory</label><input class="form-input" id="f_subcategory" placeholder="Optional" /></div>
              </div>
              <div class="form-group"><label class="form-label">Short Description</label><input class="form-input" id="f_short" placeholder="One-line summary shown on product cards" /></div>
              <div class="form-group"><label class="form-label">Full Description</label><textarea class="form-textarea" id="f_desc" placeholder="Describe the product in detail..."></textarea></div>
            </div>

            <div class="form-section">
              <h3>Pricing &amp; Stock</h3>
              <div class="form-row form-row-3">
                <div class="form-group"><label class="form-label">MRP (₹) <span class="req">*</span></label><input required type="number" class="form-input" id="f_mrp" placeholder="1999" /></div>
                <div class="form-group"><label class="form-label">Selling Price (₹) <span class="req">*</span></label><input required type="number" class="form-input" id="f_price" placeholder="1499" /></div>
                <div class="form-group"><label class="form-label">Discount</label><input class="form-input" id="f_discount_display" disabled placeholder="Auto-calculated" /></div>
              </div>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">Stock Quantity <span class="req">*</span></label><input required type="number" class="form-input" id="f_stock" placeholder="42" /></div>
                <div class="form-group"><label class="form-label">Low Stock Threshold</label><input type="number" class="form-input" id="f_lowstock" value="15" /></div>
              </div>
            </div>

            <div class="form-section">
              <h3>Product Details</h3>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">Material</label><input class="form-input" id="f_material" placeholder="e.g. Water-resistant Polyester" /></div>
                <div class="form-group"><label class="form-label">Color</label><input class="form-input" id="f_color" placeholder="e.g. Black" /></div>
              </div>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">Dimensions</label><input class="form-input" id="f_dimensions" placeholder="e.g. 45 x 32 x 18 cm" /></div>
                <div class="form-group"><label class="form-label">Weight</label><input class="form-input" id="f_weight" placeholder="e.g. 0.9 kg" /></div>
              </div>
              <div class="form-row form-row-2">
                <div class="form-group"><label class="form-label">Warranty</label><input class="form-input" id="f_warranty" placeholder="e.g. 1 Year Manufacturer Warranty" /></div>
                <div class="form-group"><label class="form-label">Care Instructions</label><input class="form-input" id="f_care" placeholder="e.g. Wipe with a dry cloth" /></div>
              </div>
            </div>
          </div>

          <div class="sticky-side">
            <div class="form-section">
              <h3>Visibility</h3>
              <div class="flex justify-between items-center" style="padding:10px 0;border-bottom:1px solid var(--color-border);">
                <span class="body-text">Active</span>
                <label class="toggle"><input type="checkbox" id="f_active" checked /><span class="toggle-slider"></span></label>
              </div>
              <div class="flex justify-between items-center" style="padding:10px 0;border-bottom:1px solid var(--color-border);">
                <span class="body-text">Featured</span>
                <label class="toggle"><input type="checkbox" id="f_featured" /><span class="toggle-slider"></span></label>
              </div>
              <div class="flex justify-between items-center" style="padding:10px 0;border-bottom:1px solid var(--color-border);">
                <span class="body-text">Best Seller</span>
                <label class="toggle"><input type="checkbox" id="f_bestseller" /><span class="toggle-slider"></span></label>
              </div>
              <div class="flex justify-between items-center" style="padding:10px 0;">
                <span class="body-text">New Arrival</span>
                <label class="toggle"><input type="checkbox" id="f_new" checked /><span class="toggle-slider"></span></label>
              </div>
            </div>
            <div class="form-section">
              <button type="submit" class="btn btn-primary btn-block" style="margin-bottom:10px;" id="saveBtn" id="saveBtnLabel">Save Product</button>
              <a href="/admin/products.html" class="btn btn-ghost btn-block">Cancel</a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
AdminShell.init('products', 'Edit Product');
const data = window.SBH_DATA;
document.getElementById('f_category').innerHTML = data.CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

function renderUploader(images) {
  images = images || [];
  const slots = [];
  for (let i = 0; i < 6; i++) {
    if (images[i]) {
      slots.push(`<div class="uploader-slot"><img src="${images[i]}" alt="Product image ${i+1}" />${i===0?'<span class="primary-tag">Primary</span>':''}<button type="button" class="remove-tag" onclick="showToast('Image removed')">×</button></div>`);
    } else if (i === images.length) {
      slots.push(`<label class="uploader-slot" style="cursor:pointer;" onclick="event.preventDefault(); showToast('Image upload is simulated in this prototype')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
        Upload
      </label>`);
    } else {
      slots.push(`<div class="uploader-slot" style="opacity:.4;"></div>`);
    }
  }
  document.getElementById('imageUploader').innerHTML = slots.join('');
}
renderUploader(["https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop&q=80"]);

function updateDiscount() {
  const mrp = Number(document.getElementById('f_mrp').value) || 0;
  const price = Number(document.getElementById('f_price').value) || 0;
  if (mrp && price && mrp > price) {
    document.getElementById('f_discount_display').value = Math.round(((mrp-price)/mrp)*100) + '% OFF';
  } else {
    document.getElementById('f_discount_display').value = '';
  }
}
document.getElementById('f_mrp').addEventListener('input', updateDiscount);
document.getElementById('f_price').addEventListener('input', updateDiscount);

const editId = new URLSearchParams(window.location.search).get('id');
const editProduct = data.getProduct(editId);
if (editProduct) {
  document.getElementById('f_name').value = editProduct.name;
  document.getElementById('f_sku').value = editProduct.sku;
  document.getElementById('f_brand').value = editProduct.brand;
  document.getElementById('f_category').value = editProduct.category;
  document.getElementById('f_short').value = editProduct.desc.slice(0, 80);
  document.getElementById('f_desc').value = editProduct.desc;
  document.getElementById('f_mrp').value = editProduct.mrp;
  document.getElementById('f_price').value = editProduct.price;
  document.getElementById('f_stock').value = editProduct.stock;
  document.getElementById('f_material').value = editProduct.material;
  document.getElementById('f_color').value = editProduct.color;
  document.getElementById('f_dimensions').value = editProduct.dimensions;
  document.getElementById('f_weight').value = editProduct.weight;
  document.getElementById('f_warranty').value = editProduct.warranty;
  document.getElementById('f_featured').checked = !!editProduct.featured;
  document.getElementById('f_bestseller').checked = !!editProduct.bestseller;
  document.getElementById('f_new').checked = !!editProduct.newArrival;
  renderUploader(editProduct.images);
  updateDiscount();
}

document.getElementById('productForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  setTimeout(() => {
    showToast('Product updated successfully', 'success');
    setTimeout(() => window.location.href = '/admin/products.html', 700);
  }, 700);
});
</script>
</body>
</html>
