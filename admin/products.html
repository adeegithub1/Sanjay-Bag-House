<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
<style>html:not(.admin-authed) .admin-shell{display:none}</style>
</head>
<body class="admin-body">
<script type="module" src="/js/admin-guard.js"></script>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head">
        <div><h1>Products</h1><p>Manage your product catalogue.</p></div>
        <a href="/admin/product-new.html" class="btn btn-primary">+ Add Product</a>
      </div>

      <div class="admin-toolbar">
        <div class="admin-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="pSearch" placeholder="Search products by name or SKU..." />
        </div>
        <select class="admin-select" id="pCategoryFilter"><option value="">All Categories</option></select>
        <select class="admin-select" id="pStatusFilter"><option value="">All Status</option><option value="active">Active</option><option value="archived">Archived</option><option value="out">Out of Stock</option></select>
        <select class="admin-select" id="pSort"><option value="">Sort: Default</option><option value="price-low">Price: Low-High</option><option value="price-high">Price: High-Low</option><option value="stock">Stock: Low-High</option></select>
      </div>

      <div class="admin-panel">
        <div class="dt-wrap">
          <table class="data-table">
            <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </div>
      <p class="caption-text" id="pCount"></p>
    </div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
AdminShell.init('products', 'Products');
const data = window.SBH_DATA;

document.getElementById('pCategoryFilter').innerHTML += data.CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

let localProducts = data.PRODUCTS.map(p => ({...p, active: true}));

function statusOf(p) {
  if (p.stock <= 0) return { label: 'Out of Stock', cls: 'danger' };
  if (!p.active) return { label: 'Archived', cls: 'neutral' };
  return { label: 'Active', cls: 'success' };
}

function render() {
  const q = document.getElementById('pSearch').value.toLowerCase();
  const cat = document.getElementById('pCategoryFilter').value;
  const status = document.getElementById('pStatusFilter').value;
  const sort = document.getElementById('pSort').value;

  let list = localProducts.filter(p => (p.name + p.sku).toLowerCase().includes(q));
  if (cat) list = list.filter(p => p.category === cat);
  if (status === 'active') list = list.filter(p => p.active && p.stock > 0);
  if (status === 'archived') list = list.filter(p => !p.active);
  if (status === 'out') list = list.filter(p => p.stock <= 0);
  if (sort === 'price-low') list = list.slice().sort((a,b)=>a.price-b.price);
  if (sort === 'price-high') list = list.slice().sort((a,b)=>b.price-a.price);
  if (sort === 'stock') list = list.slice().sort((a,b)=>a.stock-b.stock);

  document.getElementById('pCount').textContent = `Showing ${list.length} of ${localProducts.length} products`;
  document.getElementById('productsBody').innerHTML = list.map(p => {
    const s = statusOf(p);
    return `
    <tr>
      <td><div class="dt-product-cell"><img src="${p.images[0]}" alt="${p.name}"/><div><div class="pname">${p.name}</div><div class="psku">${p.color}</div></div></div></td>
      <td>${p.sku}</td>
      <td style="text-transform:capitalize;">${p.category.replace('-',' ')}</td>
      <td>${data.formatINR(p.price)}</td>
      <td>${p.stock} units</td>
      <td><span class="badge badge-${s.cls}">${s.label}</span></td>
      <td>
        <div class="row-actions">
          <a href="/admin/product-edit.html?id=${p.id}"><button aria-label="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/></svg></button></a>
          <button aria-label="Duplicate" onclick="showToast('Product duplicated successfully','success')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button aria-label="Archive" onclick="archiveProduct('${p.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M10 13h4"/></svg></button>
          <button aria-label="Delete" onclick="deleteProduct('${p.id}')" style="color:var(--color-danger);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

window.archiveProduct = function(id) {
  const p = localProducts.find(x=>x.id===id);
  p.active = !p.active;
  showToast(p.active ? 'Product activated' : 'Product archived', 'success');
  render();
};
window.deleteProduct = function(id) {
  showConfirmDialog('Are you sure you want to delete this product? This action cannot be undone.', () => {
    localProducts = localProducts.filter(p => p.id !== id);
    showToast('Product deleted successfully', 'success');
    render();
  });
};

['pSearch','pCategoryFilter','pStatusFilter','pSort'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
