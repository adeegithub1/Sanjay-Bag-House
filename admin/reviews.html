<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reviews | Sanjay Bag House Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
<style>html:not(.admin-authed) .admin-shell{display:none}</style>
</head>
<body class="admin-body">
<script type="module" src="/js/admin-guard.js"></script>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="admin-page-head"><div><h1>Reviews</h1><p>Moderate customer reviews before they go live.</p></div></div>

      <div class="pill-tabs" id="reviewTabs" style="margin-bottom:18px;">
        <button class="pill-tab active" data-f="All">All</button>
        <button class="pill-tab" data-f="Pending">Pending</button>
        <button class="pill-tab" data-f="Approved">Approved</button>
        <button class="pill-tab" data-f="Rejected">Rejected</button>
      </div>

      <div class="admin-panel">
        <div class="dt-wrap">
          <table class="data-table">
            <thead><tr><th>Customer</th><th>Product</th><th>Rating</th><th>Review</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="revBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin-shell.js"></script>
<script type="module">
import { db } from "/js/firebase-init.js";
import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

(async () => {
  AdminShell.init('reviews', 'Reviews');

  function stars(n) { return "★★★★★☆☆☆☆☆".slice(5-n,10-n); }
  function formatDate(ts) { return ts?.toDate ? ts.toDate().toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—'; }
  function labelOf(s) { return { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' }[s] || s; }

  const [reviewSnap, prodSnap] = await Promise.all([
    getDocs(collection(db, "reviews")),
    getDocs(collection(db, "products")),
  ]);
  const products = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  let reviews = reviewSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  let filter = 'All';

  function render() {
    let list = filter === 'All' ? reviews : reviews.filter(r => labelOf(r.status) === filter);
    document.getElementById('revBody').innerHTML = list.map(r => {
      const p = products.find(pp => pp.id === r.productId);
      const statusCls = r.status === 'approved' ? 'success' : r.status === 'rejected' ? 'danger' : 'warning';
      return `
      <tr>
        <td>${r.customerName || 'Customer'}</td>
        <td>${p ? p.name : '—'}</td>
        <td><span style="color:var(--color-star);">${stars(r.rating)}</span></td>
        <td style="max-width:280px;font-size:12.5px;">${r.text}</td>
        <td>${formatDate(r.createdAt)}</td>
        <td><span class="badge badge-${statusCls}">${labelOf(r.status)}</span></td>
        <td>
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="setReviewStatus('${r.id}','approved')">Approve</button>
            <button class="btn btn-ghost btn-sm" onclick="setReviewStatus('${r.id}','rejected')">Reject</button>
            <button aria-label="Delete" style="color:var(--color-danger);" onclick="deleteReview('${r.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');
    if (!list.length) {
      document.getElementById('revBody').innerHTML = `<tr><td colspan="7"><div class="empty-state" style="padding:30px;"><p style="font-size:13px;">No reviews${filter!=='All' ? ' with this status' : ''} yet.</p></div></td></tr>`;
    }
  }

  window.setReviewStatus = async function(id, status) {
    try {
      await updateDoc(doc(db, "reviews", id), { status });
      const r = reviews.find(x=>x.id===id);
      r.status = status;
      showToast(`Review ${labelOf(status).toLowerCase()}`, 'success');
      render();
    } catch (err) {
      showToast('Could not update review. Please try again.', 'error');
    }
  };
  window.deleteReview = function(id) {
    showConfirmDialog('Delete this review permanently?', async () => {
      try {
        await deleteDoc(doc(db, "reviews", id));
        reviews = reviews.filter(r=>r.id!==id);
        showToast('Review deleted', 'success');
        render();
      } catch (err) {
        showToast('Could not delete review. Please try again.', 'error');
      }
    });
  };

  document.querySelectorAll('#reviewTabs .pill-tab').forEach(btn => btn.addEventListener('click', function() {
    document.querySelectorAll('#reviewTabs .pill-tab').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    filter = this.dataset.f;
    render();
  }));
  render();
})();
</script>
</body>
</html>
