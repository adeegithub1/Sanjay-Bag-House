<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container">
  <nav class="breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><span class="current">Cart</span></nav>
  <h1 class="section-heading">Your Cart</h1>

  <div id="cartWrap"></div>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script type="module" src="/js/firebase-data.js"></script>
<script type="module">
import { db } from "/js/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import SBHAuth from "/js/auth.js";

SBHComponents.init('shop');
const data = window.SBH_DATA;
const { loadShippingSettings } = await import("/js/store-settings.js");
const shippingSettings = await loadShippingSettings();

function getStoredCoupon() {
  try { return JSON.parse(localStorage.getItem('sbh_coupon')); } catch (e) { return null; }
}
function setStoredCoupon(c) {
  if (c) localStorage.setItem('sbh_coupon', JSON.stringify(c));
  else localStorage.removeItem('sbh_coupon');
}
let appliedCoupon = getStoredCoupon();

async function render() {
  const items = await window.SBHStore.cartDetailed();
  const wrap = document.getElementById('cartWrap');
  if (!items.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added anything yet. Start exploring our collection.</p>
        <a href="/shop.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
    return;
  }
  const subtotal = items.reduce((s,i) => s + i.lineTotal, 0);
  const mrpTotal = items.reduce((s,i) => s + i.mrp * i.qty, 0);
  const couponAmount = appliedCoupon ? appliedCoupon.amount : 0;
  const discount = (mrpTotal - subtotal) + couponAmount;
  const shipping = subtotal > shippingSettings.freeThreshold ? 0 : shippingSettings.standardCharge;
  const total = subtotal - couponAmount + shipping;

  wrap.innerHTML = `
  <div class="cart-layout">
    <div>
      ${items.map(i => `
        <div class="cart-item">
          <a href="/product.html?slug=${i.slug}"><img src="${i.images[0]}" alt="${i.name}" /></a>
          <div>
            <div class="flex justify-between">
              <div>
                <a href="/product.html?slug=${i.slug}" class="cart-item-name">${i.name}</a>
                <div class="cart-item-meta">${i.color} · SKU: ${i.sku}</div>
              </div>
              <strong>${data.formatINR(i.lineTotal)}</strong>
            </div>
            <div class="cart-item-footer">
              <div class="qty-selector">
                <button onclick="updateQty('${i.id}', ${i.qty-1})" aria-label="Decrease quantity">−</button>
                <span>${i.qty}</span>
                <button onclick="updateQty('${i.id}', ${i.qty+1})" aria-label="Increase quantity">+</button>
              </div>
              <button class="remove-link" onclick="removeItem('${i.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
                Remove
              </button>
            </div>
          </div>
        </div>`).join('')}
      <a href="/shop.html" class="btn btn-ghost" style="margin-top:18px;">← Continue Shopping</a>
    </div>

    <div>
      <div class="card" style="padding:22px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Order Summary</h3>
        <div class="coupon-row">
          <input type="text" class="form-input" id="couponInput" placeholder="Enter coupon code" value="${appliedCoupon ? appliedCoupon.code : ''}" />
          <button class="btn btn-secondary btn-sm" onclick="applyCoupon()">${appliedCoupon ? 'Remove' : 'Apply'}</button>
        </div>
        <div id="couponMsg">${appliedCoupon ? `<p class="form-hint" style="color:var(--color-success);">Coupon "${appliedCoupon.code}" applied</p>` : ''}</div>
        <div class="summary-row"><span>Subtotal</span><span>${data.formatINR(subtotal)}</span></div>
        <div class="summary-row"><span>Discount</span><span style="color:var(--color-success);">− ${data.formatINR(discount)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : data.formatINR(shipping)}</span></div>
        <div class="summary-row total"><span>Total</span><span>${data.formatINR(total)}</span></div>
        ${discount > 0 ? `<div style="background:var(--color-success-bg);color:var(--color-success);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:13px;font-weight:700;text-align:center;">🎉 You saved ${data.formatINR(discount)} on this order!</div>` : ''}
        <a href="/checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Proceed to Checkout</a>
      </div>
    </div>
  </div>`;
}

window.updateQty = function(id, qty) { window.SBHStore.updateQty(id, qty); render(); };
window.removeItem = function(id) { window.SBHStore.removeFromCart(id); showToast('Item removed from cart'); render(); };

window.applyCoupon = async function() {
  const msg = document.getElementById('couponMsg');

  // If a coupon is already applied, this button acts as "Remove"
  if (appliedCoupon) {
    appliedCoupon = null;
    setStoredCoupon(null);
    msg.innerHTML = '';
    render();
    return;
  }

  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  if (!code) return;

  const user = await SBHAuth.getCurrentUser();
  if (!user) {
    msg.innerHTML = `<p class="form-error">Please <a href="/login.html?next=/cart.html" style="color:var(--color-accent);font-weight:600;">log in</a> to apply a coupon.</p>`;
    return;
  }

  try {
    const snap = await getDoc(doc(db, "coupons", code));
    if (!snap.exists() || !snap.data().active) {
      msg.innerHTML = `<p class="form-error">Invalid or expired coupon code.</p>`;
      return;
    }
    const coupon = snap.data();

    const today = new Date().toISOString().slice(0,10);
    if (coupon.start && today < coupon.start) { msg.innerHTML = `<p class="form-error">This coupon isn't active yet.</p>`; return; }
    if (coupon.end && today > coupon.end) { msg.innerHTML = `<p class="form-error">This coupon has expired.</p>`; return; }
    if (coupon.usageLimit && (coupon.used||0) >= coupon.usageLimit) { msg.innerHTML = `<p class="form-error">This coupon has reached its usage limit.</p>`; return; }

    const items = await window.SBHStore.cartDetailed();
    const subtotal = items.reduce((s,i)=>s+i.lineTotal,0);
    if (subtotal < coupon.minOrder) { msg.innerHTML = `<p class="form-error">Minimum order of ${data.formatINR(coupon.minOrder)} required for this coupon.</p>`; return; }

    const amount = coupon.type === 'Percentage' ? Math.min(Math.round(subtotal * coupon.value/100), coupon.maxDiscount || Infinity) : coupon.value;
    appliedCoupon = { code, amount };
    setStoredCoupon(appliedCoupon);
    showToast('Coupon applied successfully', 'success');
    render();
  } catch (err) {
    msg.innerHTML = `<p class="form-error">Could not validate coupon. Please try again.</p>`;
  }
};

document.addEventListener('sbh:cart-updated', render);
render();
</script>
</body>
</html>
