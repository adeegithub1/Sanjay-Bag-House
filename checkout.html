<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container" style="padding-bottom:60px;">
  <h1 class="section-heading" style="margin:20px 0 6px;">Checkout</h1>
  <div class="checkout-steps">
    <div class="checkout-step"><span class="num">✓</span> Cart</div>
    <span class="sep">—</span>
    <div class="checkout-step active"><span class="num">2</span> Details</div>
    <span class="sep">—</span>
    <div class="checkout-step"><span class="num">3</span> Payment</div>
  </div>

  <div id="checkoutWrap"></div>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script type="module" src="/js/firebase-data.js"></script>
<script type="module">
import SBHAuth from "/js/auth.js";
import { db } from "/js/firebase-init.js";
import {
  collection, doc, runTransaction, serverTimestamp, increment,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

SBHComponents.init('shop');

const user = await SBHAuth.getCurrentUser();
if (!user) {
  window.location.href = "/login.html?next=" + encodeURIComponent("/checkout.html");
} else {

const items = await window.SBHStore.cartDetailed();
const profile = await SBHAuth.getCustomerProfile(user.uid);
const data = window.SBH_DATA;

if (!items.length) {
  document.getElementById('checkoutWrap').innerHTML = `
    <div class="empty-state">
      <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/></svg></div>
      <h3>Your cart is empty</h3>
      <p>Add a few items before checking out.</p>
      <a href="/shop.html" class="btn btn-primary">Shop Now</a>
    </div>`;
} else {
  const subtotal = items.reduce((s,i)=>s+i.lineTotal,0);
  const shipping = subtotal > 999 ? 0 : 79;
  const total = subtotal + shipping;

  document.getElementById('checkoutWrap').innerHTML = `
  <div class="cart-layout">
    <form id="checkoutForm">
      <div class="card" style="padding:22px;margin-bottom:20px;">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Customer Information</h3>
        <div class="form-row form-row-2">
          <div class="form-group"><label class="form-label">Full Name <span class="req">*</span></label><input required id="ck_name" class="form-input" placeholder="e.g. Priya Sharma" value="${profile?.name || ''}" /></div>
          <div class="form-group"><label class="form-label">Mobile Number <span class="req">*</span></label><input required id="ck_phone" type="tel" pattern="[0-9]{10}" class="form-input" placeholder="10-digit mobile number" value="${profile?.phone || ''}" /></div>
        </div>
        <div class="form-group"><label class="form-label">Email Address</label><input id="ck_email" type="email" class="form-input" value="${user.email || ''}" disabled /></div>
      </div>

      <div class="card" style="padding:22px;margin-bottom:20px;">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Shipping Address</h3>
        <div class="form-group"><label class="form-label">Address <span class="req">*</span></label><input required id="ck_line1" class="form-input" placeholder="House no., building, street" /></div>
        <div class="form-row form-row-2">
          <div class="form-group"><label class="form-label">Apartment / House</label><input id="ck_line2" class="form-input" placeholder="Optional" /></div>
          <div class="form-group"><label class="form-label">Landmark</label><input id="ck_landmark" class="form-input" placeholder="Optional" /></div>
        </div>
        <div class="form-row form-row-3">
          <div class="form-group"><label class="form-label">City <span class="req">*</span></label><input required id="ck_city" class="form-input" placeholder="City" /></div>
          <div class="form-group"><label class="form-label">State <span class="req">*</span></label>
            <select required id="ck_state" class="form-select"><option value="">Select State</option><option>Maharashtra</option><option>Delhi</option><option>Karnataka</option><option>Gujarat</option><option>Rajasthan</option><option>Uttar Pradesh</option><option>Tamil Nadu</option></select>
          </div>
          <div class="form-group"><label class="form-label">PIN Code <span class="req">*</span></label><input required id="ck_pincode" pattern="[0-9]{6}" class="form-input" placeholder="6-digit PIN" /></div>
        </div>
      </div>

      <div class="card" style="padding:22px;">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Payment Method</h3>
        <label class="radio-card" style="margin-bottom:10px;opacity:.55;cursor:not-allowed;">
          <input type="radio" name="pay" disabled />
          <div>
            <strong style="font-size:13.5px;">Online Payment</strong>
            <p class="caption-text">UPI, Cards, Netbanking &amp; Wallets — coming soon</p>
          </div>
        </label>
        <label class="radio-card selected" id="codCard">
          <input type="radio" name="pay" checked disabled />
          <div>
            <strong style="font-size:13.5px;">Cash on Delivery</strong>
            <p class="caption-text">Pay when your order arrives</p>
          </div>
        </label>
      </div>
    </form>

    <div>
      <div class="card" style="padding:22px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Order Summary</h3>
        ${items.map(i => `<div class="summary-row"><span>${i.name} × ${i.qty}</span><span>${data.formatINR(i.lineTotal)}</span></div>`).join('')}
        <div class="summary-row"><span>Subtotal</span><span>${data.formatINR(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : data.formatINR(shipping)}</span></div>
        <div class="summary-row total"><span>Total</span><span id="totalDisplay">${data.formatINR(total)}</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="placeOrder(event)" id="placeOrderBtn">Place Order (COD)</button>
        <p class="caption-text" style="text-align:center;margin-top:10px;">🔒 Your information is safe and secure</p>
      </div>
    </div>
  </div>`;
}

window.placeOrder = async function(e) {
  e.preventDefault();
  const form = document.getElementById('checkoutForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Placing order...';

  const address = {
    name: document.getElementById('ck_name').value.trim(),
    phone: document.getElementById('ck_phone').value.trim(),
    line1: document.getElementById('ck_line1').value.trim(),
    line2: document.getElementById('ck_line2').value.trim(),
    landmark: document.getElementById('ck_landmark').value.trim(),
    city: document.getElementById('ck_city').value.trim(),
    state: document.getElementById('ck_state').value,
    pincode: document.getElementById('ck_pincode').value.trim(),
  };

  try {
    // Re-fetch fresh cart details right before writing, and run as a
    // transaction so stock is decremented atomically (best effort client-side
    // protection — not as strong as a server-side Cloud Function, but still
    // prevents two near-simultaneous checkouts from both silently overselling
    // within the same browser session's transaction window).
    const freshItems = await window.SBHStore.cartDetailed();
    if (!freshItems.length) throw new Error("Your cart is empty.");

    const orderRef = doc(collection(db, "orders"));

    await runTransaction(db, async (tx) => {
      const productRefs = freshItems.map(i => doc(db, "products", i.id));
      const snaps = await Promise.all(productRefs.map(ref => tx.get(ref)));

      let subtotal = 0;
      const orderItems = [];
      for (let idx = 0; idx < freshItems.length; idx++) {
        const snap = snaps[idx];
        if (!snap.exists()) throw new Error(`${freshItems[idx].name} is no longer available.`);
        const product = snap.data();
        const qty = freshItems[idx].qty;
        if ((product.stock || 0) < qty) throw new Error(`${product.name} doesn't have enough stock left.`);
        const lineTotal = product.price * qty;
        subtotal += lineTotal;
        orderItems.push({
          productId: snap.id, name: product.name, sku: product.sku || "",
          image: (product.images && product.images[0]) || "",
          price: product.price, qty, lineTotal,
        });
      }
      for (let idx = 0; idx < freshItems.length; idx++) {
        tx.update(productRefs[idx], { stock: snaps[idx].data().stock - freshItems[idx].qty });
      }

      const shipping = subtotal >= 999 ? 0 : 79;
      const total = subtotal + shipping;

      tx.set(orderRef, {
        userId: user.uid,
        items: orderItems,
        address,
        paymentMethod: "cod",
        subtotal, shipping, total,
        status: "pending",
        createdAt: serverTimestamp(),
      });
    });

    // Best-effort customer stats update (not critical if it fails)
    try {
      const { updateDoc } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
      await updateDoc(doc(db, "customers", user.uid), {
        orderCount: increment(1),
      });
    } catch (e) { /* non-critical */ }

    window.SBHStore.clearCart();
    window.location.href = '/order-success.html?orderId=' + encodeURIComponent(orderRef.id);
  } catch (err) {
    showToast(err.message || 'Could not place order. Please try again.', 'error');
    btn.disabled = false; btn.textContent = 'Place Order (COD)';
  }
};

} // end else (user signed in)
</script>
</body>
</html>
