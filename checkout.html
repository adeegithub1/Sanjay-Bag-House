<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<div id="sbh-header"></div>

<main class="container" style="padding-bottom:60px;">
  <h1 class="section-heading" style="margin:20px 0 6px;">Checkout</h1>
  <div class="checkout-steps">
    <div class="checkout-step"><span class="num">✓</span> Cart</div>
    <span class="sep">—</span>
    <div class="checkout-step active"><span class="num">2</span> Details</div>
    <span class="sep">—</span>
    <div class="checkout-step"><span class="num">3</span> Payment</div>
  </div>

  <div id="checkoutWrap">
    <div class="empty-state"><p>Loading checkout…</p></div>
  </div>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script type="module" src="/js/firebase-data.js"></script>

<script type="module">
/* ------------------------------------------------------------------
   Checkout page
   Everything runs inside init() so that ANY failure (a missing module,
   a Firestore permission error, a bad settings document, ...) shows a
   visible message instead of leaving the page blank.
------------------------------------------------------------------- */

const FIRESTORE_URL = "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const INDIAN_STATES = [
  "Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh",
  "Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana",
  "Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep",
  "Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry",
  "Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand",
  "West Bengal"
];

const wrap = document.getElementById('checkoutWrap');

/* ---------- small helpers ---------- */

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const num = (v, fallback = 0) => {
  if (v === '' || v === null || v === undefined) return fallback;
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};

const formatINR = (n) => {
  try {
    if (window.SBH_DATA && typeof window.SBH_DATA.formatINR === 'function') return window.SBH_DATA.formatINR(n);
  } catch (e) { /* fall through */ }
  return '₹' + Number(n || 0).toLocaleString('en-IN');
};

const toast = (msg, type) => {
  if (typeof window.showToast === 'function') window.showToast(msg, type);
  else alert(msg);
};

const normState = (s) => String(s || '').toLowerCase().replace(/&/g, 'and').replace(/^nct of /, '').replace(/\s+/g, ' ').trim();

async function waitFor(fn, timeoutMs = 5000) {
  const start = Date.now();
  while (Date.now() - start < timeoutMs) {
    const v = fn();
    if (v) return v;
    await new Promise((r) => setTimeout(r, 50));
  }
  return null;
}

function showError(title, message, detail) {
  wrap.innerHTML = `
    <div class="empty-state">
      <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      ${detail ? `<p class="caption-text" style="word-break:break-word;">${esc(detail)}</p>` : ''}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button type="button" class="btn btn-primary" onclick="location.reload()">Try Again</button>
        <a href="/cart.html" class="btn btn-primary">Back to Cart</a>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ */

async function init() {

  // Header / footer — must never be able to break checkout itself.
  try {
    if (window.SBHComponents && typeof window.SBHComponents.init === 'function') window.SBHComponents.init('shop');
  } catch (e) { console.warn('Header/footer failed to render:', e); }

  /* ---------- load modules (dynamic so a failure is catchable) ---------- */
  let SBHAuth, db, fs, settingsMod;
  try {
    const authMod = await import('/js/auth.js');
    SBHAuth = authMod.default || authMod.SBHAuth;
    ({ db } = await import('/js/firebase-init.js'));
    fs = await import(FIRESTORE_URL);
    settingsMod = await import('/js/store-settings.js');
  } catch (err) {
    console.error('Checkout: module load failed', err);
    showError('Checkout could not load', 'A required script failed to load. Please refresh the page.', err && err.message);
    return;
  }
  if (!SBHAuth || typeof SBHAuth.getCurrentUser !== 'function') {
    showError('Checkout could not load', 'Sign-in service is unavailable. Please refresh the page.');
    return;
  }
  const { collection, doc, runTransaction, serverTimestamp, increment, getDoc, updateDoc, query, where, getDocs } = fs;

  /* ---------- store settings ---------- */
  let shippingRaw;
  try {
    shippingRaw = await settingsMod.loadShippingSettings();
  } catch (err) {
    console.error('Checkout: shipping settings failed', err);
    showError('Checkout could not load', 'We couldn’t load the shipping settings. Please try again in a moment.', err && err.message);
    return;
  }
  shippingRaw = shippingRaw || {};
  const shippingSettings = {
    codEnabled: !!shippingRaw.codEnabled,
    freeThreshold: num(shippingRaw.freeThreshold, Infinity),
    standardCharge: num(shippingRaw.standardCharge, 0),
    codFee: num(shippingRaw.codFee, 0),
    codMinOrder: num(shippingRaw.codMinOrder, 0),
    codMaxOrder: num(shippingRaw.codMaxOrder, 0),
  };

  let paymentSettings = { razorpayEnabled: false, razorpayKeyId: '', testMode: false };
  try { paymentSettings = Object.assign(paymentSettings, (await settingsMod.loadPaymentSettings()) || {}); }
  catch (e) { console.warn('Payment settings unavailable — online payment disabled:', e); }

  let brandingSettings = {};
  try { brandingSettings = (await settingsMod.loadBrandingSettings()) || {}; }
  catch (e) { console.warn('Branding settings unavailable:', e); }
  const storeDisplayName = brandingSettings.storeName || 'Sanjay Bag House';

  /* ---------- signed-in user ---------- */
  let user;
  try { user = await SBHAuth.getCurrentUser(); }
  catch (err) {
    console.error('Checkout: auth failed', err);
    showError('Checkout could not load', 'We couldn’t check your sign-in. Please try again.', err && err.message);
    return;
  }
  if (!user) {
    // Keep the full URL (including ?buynow=1) so the customer returns to the same checkout.
    window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  let profile = null;
  try { profile = await SBHAuth.getCustomerProfile(user.uid); }
  catch (e) { console.warn('Customer profile unavailable — form will start empty:', e); }

  /* ---------- checkout items ---------- */
  const isBuyNow = new URLSearchParams(window.location.search).get('buynow') === '1';

  function normalizeItem(i) {
    if (!i) return null;
    const qty = Math.max(0, parseInt(i.qty, 10) || 0);
    const price = num(i.price, 0);
    return { ...i, qty, price, lineTotal: Number.isFinite(Number(i.lineTotal)) ? Number(i.lineTotal) : price * qty };
  }

  // Product data lives in Firestore and loads asynchronously. The cart can
  // only be turned into full product rows once that data has arrived.
  async function ensureProductsLoaded() {
    const fsApi = await waitFor(() => window.SBH_FIRESTORE && typeof window.SBH_FIRESTORE.load === 'function' && window.SBH_FIRESTORE, 5000);
    if (!fsApi) return null;
    try { return await fsApi.load(); }
    catch (e) { console.warn('Product data failed to load:', e); return null; }
  }

  async function getCheckoutItems() {
    const fsData = await ensureProductsLoaded();
    let list = null;

    if (isBuyNow) {
      let bn = null;
      try { bn = JSON.parse(sessionStorage.getItem('sbh_buynow')); } catch (e) { bn = null; }
      if (bn && bn.productId) {
        const products = (fsData && fsData.PRODUCTS) || (window.SBH_DATA && window.SBH_DATA.PRODUCTS) || [];
        const prod = products.find((pp) => pp.id === bn.productId);
        const qty = Math.max(1, parseInt(bn.qty, 10) || 1);
        if (prod) list = [{ ...prod, qty, lineTotal: num(prod.price, 0) * qty }];
      }
      // Buy Now data missing/expired — fall back to the regular cart.
    }

    if (!list) list = await window.SBHStore.cartDetailed();
    return (list || []).map(normalizeItem).filter((i) => i && i.id && i.qty > 0);
  }

  let items;
  try { items = await getCheckoutItems(); }
  catch (err) {
    console.error('Checkout: could not read cart', err);
    showError('Checkout could not load', 'We couldn’t read your cart. Please try again.', err && err.message);
    return;
  }

  /* ---------- pincode auto-fill ---------- */
  let pincodeRequestId = 0;
  window.autofillFromPincode = async function (val) {
    const msgEl = document.getElementById('pincodeAutofillMsg');
    if (!msgEl) return;
    if (!/^[1-9][0-9]{5}$/.test(val)) { msgEl.textContent = ''; msgEl.style.color = ''; return; }
    const myId = ++pincodeRequestId;
    msgEl.style.color = '';
    msgEl.textContent = 'Looking up city/state...';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      const res = await fetch(`https://api.postalpincode.in/pincode/${val}`, { signal: ctrl.signal });
      clearTimeout(timer);
      const result = await res.json();
      if (myId !== pincodeRequestId) return; // a newer lookup superseded this one
      const office = result?.[0]?.Status === 'Success' ? result[0].PostOffice?.[0] : null;
      if (office) {
        document.getElementById('ck_city').value = office.District || office.Block || '';
        const stateSelect = document.getElementById('ck_state');
        const match = Array.from(stateSelect.options).find((o) => normState(o.value) === normState(office.State));
        if (match) stateSelect.value = match.value;
        msgEl.textContent = `✓ ${office.District}, ${office.State}`;
        msgEl.style.color = 'var(--color-success)';
      } else {
        msgEl.textContent = 'Could not auto-detect — please fill city/state manually.';
      }
    } catch (e) {
      if (myId === pincodeRequestId) msgEl.textContent = ''; // silent fail — auto-fill is a convenience
    }
  };

  /* ---------- coupon ---------- */
  let storedCoupon = null;
  try { storedCoupon = JSON.parse(localStorage.getItem('sbh_coupon')); } catch (e) { storedCoupon = null; }
  if (storedCoupon && !storedCoupon.code) storedCoupon = null;

  // Validates the coupon against the REAL Firestore document (localStorage can be edited by the customer).
  // Returns { ok, discount } or { ok:false, reason, transient }.
  async function verifyCoupon(subtotal) {
    if (!storedCoupon) return { ok: true, discount: 0, code: null };
    try {
      const couponSnap = await getDoc(doc(db, 'coupons', storedCoupon.code));
      if (!couponSnap.exists() || !couponSnap.data().active) return { ok: false, reason: 'Your coupon is no longer valid.' };
      const c = couponSnap.data();
      const today = new Date().toISOString().slice(0, 10);
      if (c.start && today < c.start) return { ok: false, reason: 'Your coupon isn’t active yet.' };
      if (c.end && today > c.end) return { ok: false, reason: 'Your coupon has expired.' };
      if (c.usageLimit && (c.used || 0) >= c.usageLimit) return { ok: false, reason: 'Your coupon has reached its usage limit.' };
      if (c.perUser) {
        const mine = await getDocs(query(collection(db, 'orders'), where('userId', '==', user.uid), where('couponCode', '==', storedCoupon.code)));
        if (mine.size >= c.perUser) return { ok: false, reason: 'You’ve already used this coupon the maximum number of times.' };
      }
      if (c.minOrder && subtotal < c.minOrder) return { ok: false, reason: `A minimum order of ${formatINR(c.minOrder)} is required for this coupon.` };
      let discount = c.type === 'Percentage'
        ? Math.min(Math.round(subtotal * num(c.value, 0) / 100), c.maxDiscount || Infinity)
        : num(c.value, 0);
      discount = Math.max(0, Math.min(discount, subtotal));
      return { ok: true, discount, code: storedCoupon.code };
    } catch (err) {
      console.warn('Coupon verification failed:', err);
      return { ok: false, reason: 'We couldn’t verify your coupon right now.', transient: true };
    }
  }

  /* ---------- totals ---------- */
  const itemsSubtotal = items.reduce((s, i) => s + i.lineTotal, 0);
  const mrpTotal = items.reduce((s, i) => s + (num(i.mrp, i.price)) * i.qty, 0);

  let couponDiscount = 0;
  let couponNotice = '';
  if (items.length && storedCoupon) {
    const cv = await verifyCoupon(itemsSubtotal);
    if (cv.ok) couponDiscount = cv.discount;
    else if (cv.transient) couponDiscount = Math.min(num(storedCoupon.amount, 0), itemsSubtotal); // display only; re-verified at order time
    else {
      couponNotice = `Coupon ${storedCoupon.code} was removed: ${cv.reason}`;
      localStorage.removeItem('sbh_coupon');
      storedCoupon = null;
    }
  }

  const belowCodMin = shippingSettings.codMinOrder > 0 && itemsSubtotal < shippingSettings.codMinOrder;
  const aboveCodMax = shippingSettings.codMaxOrder > 0 && itemsSubtotal > shippingSettings.codMaxOrder;
  const codBlocked = belowCodMin || aboveCodMax;
  const codAvailable = shippingSettings.codEnabled && !codBlocked;
  const onlineEnabled = !!(paymentSettings.razorpayEnabled && paymentSettings.razorpayKeyId);

  let selectedPaymentMethod = codAvailable ? 'cod' : 'razorpay';
  let orderInFlight = false;

  function computeTotals(method) {
    const subtotal = itemsSubtotal;
    const discount = Math.min(couponDiscount, subtotal);
    const shipping = subtotal >= shippingSettings.freeThreshold ? 0 : shippingSettings.standardCharge;
    const codFee = method === 'cod' ? shippingSettings.codFee : 0;
    const total = subtotal - discount + shipping + codFee;
    const savings = (mrpTotal - subtotal) + discount;
    return { subtotal, discount, shipping, codFee, total, savings };
  }

  /* ---------- rendering ---------- */
  if (!items.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
        <h3>Your cart is empty</h3>
        <p>Add a few items before checking out.</p>
        <a href="/shop.html" class="btn btn-primary">Shop Now</a>
      </div>`;
    return;
  }

  if (!codAvailable && !onlineEnabled) {
    const reason = !shippingSettings.codEnabled
      ? 'Online payments aren’t set up yet, and Cash on Delivery is currently turned off. Please check back soon.'
      : belowCodMin
        ? `Cash on Delivery needs a minimum order of ${formatINR(shippingSettings.codMinOrder)}. Add more items to your cart to continue.`
        : `Cash on Delivery is available for orders up to ${formatINR(shippingSettings.codMaxOrder)}. Please reduce your cart to continue.`;
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
        <h3>${shippingSettings.codEnabled ? 'Your order can’t be placed yet' : 'Checkout is temporarily unavailable'}</h3>
        <p>${esc(reason)}</p>
        <a href="${shippingSettings.codEnabled ? '/cart.html' : '/shop.html'}" class="btn btn-primary">${shippingSettings.codEnabled ? 'Back to Cart' : 'Continue Shopping'}</a>
      </div>`;
    return;
  }

  const stateOptions = INDIAN_STATES.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

  wrap.innerHTML = `
    <div class="cart-layout">
      <form id="checkoutForm">
        <div class="card" style="padding:22px;margin-bottom:20px;">
          <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Customer Information</h3>
          <div class="form-row form-row-2">
            <div class="form-group"><label class="form-label" for="ck_name">Full Name <span class="req">*</span></label><input required id="ck_name" class="form-input" placeholder="e.g. Priya Sharma" value="${esc(profile?.name || '')}" autocomplete="name" /></div>
            <div class="form-group"><label class="form-label" for="ck_phone">Mobile Number <span class="req">*</span></label><input required id="ck_phone" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" class="form-input" placeholder="10-digit mobile number" value="${esc(profile?.phone || '')}" autocomplete="tel-national" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="ck_email">Email Address</label><input id="ck_email" type="email" class="form-input" value="${esc(user.email || '')}" disabled /></div>
        </div>

        <div class="card" style="padding:22px;margin-bottom:20px;">
          <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Shipping Address</h3>
          <div class="form-group"><label class="form-label" for="ck_line1">Address <span class="req">*</span></label><input required id="ck_line1" class="form-input" placeholder="House no., building, street" autocomplete="address-line1" /></div>
          <div class="form-row form-row-2">
            <div class="form-group"><label class="form-label" for="ck_line2">Apartment / House</label><input id="ck_line2" class="form-input" placeholder="Optional" autocomplete="address-line2" /></div>
            <div class="form-group"><label class="form-label" for="ck_landmark">Landmark</label><input id="ck_landmark" class="form-input" placeholder="Optional" /></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label class="form-label" for="ck_city">City <span class="req">*</span></label><input required id="ck_city" class="form-input" placeholder="City" autocomplete="address-level2" /></div>
            <div class="form-group"><label class="form-label" for="ck_state">State <span class="req">*</span></label>
              <select required id="ck_state" class="form-select"><option value="">Select State</option>${stateOptions}</select>
            </div>
            <div class="form-group"><label class="form-label" for="ck_pincode">PIN Code <span class="req">*</span></label><input required id="ck_pincode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" class="form-input" placeholder="6-digit PIN" autocomplete="postal-code" oninput="autofillFromPincode(this.value)" /><p class="form-hint" id="pincodeAutofillMsg"></p></div>
          </div>
        </div>

        <div class="card" style="padding:22px;">
          <h3 style="font-size:14.5px;font-weight:700;margin-bottom:16px;">Payment Method</h3>
          <div id="paymentMethodWrap"></div>
        </div>
      </form>

      <div>
        <div class="card" style="padding:22px;" id="summaryWrap"></div>
      </div>
    </div>`;

  function renderSummary() {
    const t = computeTotals(selectedPaymentMethod);
    const el = document.getElementById('summaryWrap');
    if (!el) return;
    const btnLabel = selectedPaymentMethod === 'razorpay' ? 'Pay Now' : 'Place Order (COD)';
    el.innerHTML = `
      <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Order Summary</h3>
      ${items.map((i) => `<div class="summary-row"><span>${esc(i.name)} × ${i.qty}</span><span>${formatINR(i.lineTotal)}</span></div>`).join('')}
      <div class="summary-row"><span>Subtotal</span><span>${formatINR(t.subtotal)}</span></div>
      ${storedCoupon && t.discount > 0 ? `<div class="summary-row"><span>Coupon (${esc(storedCoupon.code)})</span><span style="color:var(--color-success);">− ${formatINR(t.discount)}</span></div>` : ''}
      <div class="summary-row"><span>Shipping</span><span>${t.shipping === 0 ? 'FREE' : formatINR(t.shipping)}</span></div>
      ${t.codFee > 0 ? `<div class="summary-row"><span>COD Fee</span><span>${formatINR(t.codFee)}</span></div>` : ''}
      <div class="summary-row total"><span>Total</span><span id="totalDisplay">${formatINR(t.total)}</span></div>
      ${t.savings > 0 ? `<div style="background:var(--color-success-bg);color:var(--color-success);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:13px;font-weight:700;text-align:center;">🎉 You saved ${formatINR(t.savings)} on this order!</div>` : ''}
      ${couponNotice ? `<p class="form-error" style="margin-top:8px;">${esc(couponNotice)}</p>` : ''}
      <div id="payNotice"></div>
      <button type="button" class="btn btn-primary btn-block" style="margin-top:16px;" onclick="handlePlaceOrderClick(event)" id="placeOrderBtn">${btnLabel}</button>
      <p class="caption-text" style="text-align:center;margin-top:10px;">🔒 Your information is safe and secure</p>`;
  }

  function renderPaymentMethod() {
    const el = document.getElementById('paymentMethodWrap');
    if (!el) return;
    const codHint = !shippingSettings.codEnabled
      ? 'Currently unavailable'
      : belowCodMin
        ? `Available on orders of ${formatINR(shippingSettings.codMinOrder)} or more`
        : aboveCodMax
          ? `Available on orders up to ${formatINR(shippingSettings.codMaxOrder)}`
          : 'Pay when your order arrives';

    el.innerHTML = `
      <label class="radio-card ${selectedPaymentMethod === 'razorpay' ? 'selected' : ''}" id="onlineCard" style="margin-bottom:10px;${onlineEnabled ? '' : 'opacity:.55;cursor:not-allowed;'}">
        <input type="radio" name="pay" id="payOnlineRadio" ${onlineEnabled ? '' : 'disabled'} ${selectedPaymentMethod === 'razorpay' ? 'checked' : ''} onchange="setPaymentMethod('razorpay')" />
        <div>
          <strong style="font-size:13.5px;">Online Payment ${onlineEnabled && paymentSettings.testMode ? '<span class="badge badge-warning">TEST MODE</span>' : ''}</strong>
          <p class="caption-text">${onlineEnabled ? 'UPI, Cards, Netbanking &amp; Wallets' : 'Currently unavailable'}</p>
        </div>
      </label>
      <label class="radio-card ${selectedPaymentMethod === 'cod' ? 'selected' : ''}" id="codCard" style="${codAvailable ? '' : 'opacity:.55;cursor:not-allowed;'}">
        <input type="radio" name="pay" id="payCodRadio" ${codAvailable ? '' : 'disabled'} ${selectedPaymentMethod === 'cod' ? 'checked' : ''} onchange="setPaymentMethod('cod')" />
        <div>
          <strong style="font-size:13.5px;">Cash on Delivery</strong>
          <p class="caption-text">${esc(codHint)}</p>
        </div>
      </label>`;
  }

  window.setPaymentMethod = function (method) {
    if (orderInFlight) return;
    if (method === 'cod' && !codAvailable) return;
    if (method === 'razorpay' && !onlineEnabled) return;
    selectedPaymentMethod = method;
    document.getElementById('codCard')?.classList.toggle('selected', method === 'cod');
    document.getElementById('onlineCard')?.classList.toggle('selected', method === 'razorpay');
    renderSummary(); // COD fee / total / button label depend on the method
  };

  renderPaymentMethod();
  renderSummary();

  const checkoutForm = document.getElementById('checkoutForm');
  checkoutForm.addEventListener('submit', (e) => { e.preventDefault(); window.handlePlaceOrderClick(e); });

  /* ---------- helpers used when placing an order ---------- */
  function getCheckoutAddress() {
    return {
      name: document.getElementById('ck_name').value.trim(),
      phone: document.getElementById('ck_phone').value.trim(),
      line1: document.getElementById('ck_line1').value.trim(),
      line2: document.getElementById('ck_line2').value.trim(),
      landmark: document.getElementById('ck_landmark').value.trim(),
      city: document.getElementById('ck_city').value.trim(),
      state: document.getElementById('ck_state').value,
      pincode: document.getElementById('ck_pincode').value.trim(),
    };
  }

  function setBtn(label, disabled) {
    const btn = document.getElementById('placeOrderBtn');
    if (!btn) return;
    btn.textContent = label;
    btn.disabled = !!disabled;
  }

  const idleLabel = () => (selectedPaymentMethod === 'razorpay' ? 'Pay Now' : 'Place Order (COD)');

  // Confirms stock in Firestore BEFORE the customer is asked to pay online.
  async function precheckStock(list) {
    const snaps = await Promise.all(list.map((i) => getDoc(doc(db, 'products', i.id))));
    snaps.forEach((snap, idx) => {
      if (!snap.exists()) throw new Error(`${list[idx].name} is no longer available.`);
      if (num(snap.data().stock, 0) < list[idx].qty) throw new Error(`${snap.data().name || list[idx].name} doesn’t have enough stock left.`);
    });
  }

  /**
   * Shared order-creation logic used by BOTH Cash on Delivery and Razorpay.
   * Re-validates cart / stock / coupon fresh against Firestore, writes the order
   * in a transaction (stock decremented atomically), then does best-effort follow-up work.
   */
  async function finalizeOrder(paymentMethod, extraOrderFields = {}) {
    const address = getCheckoutAddress();

    const freshItems = await getCheckoutItems();
    if (!freshItems.length) throw new Error('Your cart is empty.');

    // One entry per product (guards against the same product appearing on two cart lines).
    const qtyById = new Map();
    const nameById = new Map();
    freshItems.forEach((i) => {
      qtyById.set(i.id, (qtyById.get(i.id) || 0) + i.qty);
      nameById.set(i.id, i.name);
    });
    const productIds = Array.from(qtyById.keys());

    // Verified coupon discount, computed from the fresh subtotal.
    const freshSubtotal = freshItems.reduce((s, i) => s + i.lineTotal, 0);
    let verifiedDiscount = 0;
    let verifiedCouponCode = null;
    if (storedCoupon) {
      const cv = await verifyCoupon(freshSubtotal);
      if (!cv.ok) throw new Error(cv.reason + ' Please go back to your cart and remove the coupon.');
      verifiedDiscount = cv.discount;
      verifiedCouponCode = cv.code;
    }

    const orderRef = doc(collection(db, 'orders'));

    await runTransaction(db, async (tx) => {
      const productRefs = productIds.map((id) => doc(db, 'products', id));
      const snaps = await Promise.all(productRefs.map((ref) => tx.get(ref)));

      let subtotal = 0;
      const orderItems = [];

      for (let idx = 0; idx < productIds.length; idx++) {
        const snap = snaps[idx];
        const id = productIds[idx];
        if (!snap.exists()) throw new Error(`${nameById.get(id)} is no longer available.`);
        const product = snap.data();
        const qty = qtyById.get(id);
        if (num(product.stock, 0) < qty) throw new Error(`${product.name} doesn’t have enough stock left.`);
        const price = num(product.price, 0);
        const lineTotal = price * qty;
        subtotal += lineTotal;
        orderItems.push({
          productId: snap.id, name: product.name, sku: product.sku || '',
          image: (product.images && product.images[0]) || '',
          price, qty, lineTotal,
        });
      }

      for (let idx = 0; idx < productIds.length; idx++) {
        tx.update(productRefs[idx], { stock: num(snaps[idx].data().stock, 0) - qtyById.get(productIds[idx]) });
      }

      const shipping = subtotal >= shippingSettings.freeThreshold ? 0 : shippingSettings.standardCharge;
      const discount = Math.min(verifiedDiscount, subtotal);
      const codFee = paymentMethod === 'cod' ? shippingSettings.codFee : 0;
      const total = subtotal - discount + shipping + codFee;

      tx.set(orderRef, {
        userId: user.uid,
        items: orderItems,
        address,
        paymentMethod,
        subtotal, shipping, discount, codFee,
        couponCode: verifiedCouponCode,
        total,
        status: 'pending',
        createdAt: serverTimestamp(),
        ...extraOrderFields,
      });
    });

    // Best-effort: bump the coupon's usage counter
    if (verifiedCouponCode) {
      try {
        const couponRef = doc(db, 'coupons', verifiedCouponCode);
        const couponSnap = await getDoc(couponRef);
        if (couponSnap.exists()) await updateDoc(couponRef, { used: (couponSnap.data().used || 0) + 1 });
      } catch (e) { /* non-critical */ }
    }

    // Best-effort customer stats update
    try { await updateDoc(doc(db, 'customers', user.uid), { orderCount: increment(1) }); }
    catch (e) { /* non-critical */ }

    if (isBuyNow) sessionStorage.removeItem('sbh_buynow');
    else window.SBHStore.clearCart();
    localStorage.removeItem('sbh_coupon');

    return orderRef.id;
  }

  /* ---------- place order handlers ---------- */
  window.handlePlaceOrderClick = function (e) {
    if (e && e.preventDefault) e.preventDefault();
    if (orderInFlight) return;
    if (selectedPaymentMethod === 'razorpay') window.payWithRazorpay(e);
    else window.placeOrder(e);
  };

  window.placeOrder = async function (e) {
    if (e && e.preventDefault) e.preventDefault();
    if (orderInFlight) return;
    if (!checkoutForm.checkValidity()) { checkoutForm.reportValidity(); return; }
    if (!codAvailable) { toast('Cash on Delivery is currently unavailable for this order.', 'error'); return; }

    orderInFlight = true;
    setBtn('Placing order...', true);
    try {
      const orderId = await finalizeOrder('cod');
      window.location.href = '/order-success.html?orderId=' + encodeURIComponent(orderId);
    } catch (err) {
      console.error('Place order failed:', err);
      toast(err.message || 'Could not place order. Please try again.', 'error');
      orderInFlight = false;
      setBtn(idleLabel(), false);
    }
  };

  let razorpayScriptPromise = null;
  function loadRazorpayScript() {
    if (window.Razorpay) return Promise.resolve();
    if (razorpayScriptPromise) return razorpayScriptPromise;
    razorpayScriptPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://checkout.razorpay.com/v1/checkout.js';
      script.onload = () => resolve();
      script.onerror = () => { razorpayScriptPromise = null; reject(new Error('Could not load the payment gateway. Please check your connection and try again.')); };
      document.body.appendChild(script);
    });
    return razorpayScriptPromise;
  }

  window.payWithRazorpay = async function (e) {
    if (e && e.preventDefault) e.preventDefault();
    if (orderInFlight) return;
    if (!checkoutForm.checkValidity()) { checkoutForm.reportValidity(); return; }
    if (!onlineEnabled) { toast('Online payment is currently unavailable.', 'error'); return; }

    orderInFlight = true;
    setBtn('Loading payment gateway...', true);

    try {
      await loadRazorpayScript();

      // Fresh figures for what the customer is about to be charged.
      const freshItems = await getCheckoutItems();
      if (!freshItems.length) throw new Error('Your cart is empty.');
      await precheckStock(freshItems);

      const subtotal = freshItems.reduce((s, i) => s + i.lineTotal, 0);
      let discount = 0;
      if (storedCoupon) {
        const cv = await verifyCoupon(subtotal);
        if (!cv.ok) throw new Error(cv.reason + ' Please go back to your cart and remove the coupon.');
        discount = cv.discount;
      }
      const shipping = subtotal >= shippingSettings.freeThreshold ? 0 : shippingSettings.standardCharge;
      const displayTotal = subtotal - discount + shipping;
      if (!(displayTotal > 0)) throw new Error('The order total is invalid. Please refresh and try again.');

      const address = getCheckoutAddress();
      setBtn('Opening payment window...', true);

      const rzp = new window.Razorpay({
        key: paymentSettings.razorpayKeyId,
        amount: Math.round(displayTotal * 100), // paise
        currency: 'INR',
        name: storeDisplayName,
        description: 'Order payment',
        prefill: { name: address.name, contact: address.phone, email: user.email || '' },
        theme: { color: '#16294D' },
        handler: async function (response) {
          setBtn('Confirming order...', true);
          try {
            const orderId = await finalizeOrder('razorpay', {
              razorpayPaymentId: response.razorpay_payment_id,
              paymentStatus: 'unverified', // no backend to cryptographically verify the signature
            });
            window.location.href = '/order-success.html?orderId=' + encodeURIComponent(orderId);
          } catch (err) {
            console.error('Order save failed after payment:', err);
            // Keep the button disabled so the customer can't pay a second time.
            const notice = document.getElementById('payNotice');
            if (notice) {
              notice.innerHTML = `<p class="form-error" style="margin-top:10px;">Your payment went through, but we couldn’t save your order (${esc(err.message || 'unknown error')}). Please contact us with this payment ID: <strong>${esc(response.razorpay_payment_id)}</strong></p>`;
            }
            toast('Payment received, but the order could not be saved. Please contact us with your payment ID.', 'error');
            setBtn('Payment received', true);
          }
        },
        modal: {
          ondismiss: function () {
            // Customer closed the popup without paying.
            if (!orderInFlight) return;
            const btn = document.getElementById('placeOrderBtn');
            if (btn && btn.textContent === 'Confirming order...') return; // payment already succeeded
            orderInFlight = false;
            setBtn(idleLabel(), false);
          },
        },
      });

      rzp.on('payment.failed', function (response) {
        // The Razorpay popup stays open so the customer can retry; ondismiss resets the button.
        toast('Payment failed: ' + (response?.error?.description || 'Please try again.'), 'error');
      });

      setBtn('Complete payment in the popup...', true);
      rzp.open();
    } catch (err) {
      console.error('Razorpay start failed:', err);
      toast(err.message || 'Could not start payment. Please try again.', 'error');
      orderInFlight = false;
      setBtn(idleLabel(), false);
    }
  };
}

try {
  await init();
} catch (err) {
  console.error('Checkout crashed:', err);
  showError('Something went wrong', 'We couldn’t load checkout. Please try again.', err && err.message);
}
</script>

</body>
