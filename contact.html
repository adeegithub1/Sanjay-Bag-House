<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us | Sanjay Bag House</title>
<meta name="description" content="Get in touch with Sanjay Bag House for order support, product questions or partnership inquiries." />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>
<div class="page-hero"><div class="container"><span class="eyebrow">We're Here to Help</span><h1 class="section-heading" style="margin-top:10px;">Contact Us</h1><p>Reach out for order support, product questions or anything else.</p></div></div>
<main class="container" style="padding:50px 0;">
  <div class="cart-layout" style="grid-template-columns:1fr;gap:36px;">
    <div class="pdp-grid" style="grid-template-columns:1fr 1fr;gap:36px;">
      <div class="card" style="padding:26px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px;">Send Us a Message</h3>
        <form onsubmit="event.preventDefault(); showToast('Message sent successfully','success'); this.reset();">
          <div class="form-row form-row-2">
            <div class="form-group"><label class="form-label">Full Name</label><input required class="form-input" placeholder="Your name" /></div>
            <div class="form-group"><label class="form-label">Email</label><input required type="email" class="form-input" placeholder="you@example.com" /></div>
          </div>
          <div class="form-group"><label class="form-label">Subject</label><input class="form-input" placeholder="How can we help?" /></div>
          <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" placeholder="Write your message here..."></textarea></div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
      <div>
        <div class="card" style="padding:26px;margin-bottom:16px;">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px;">Get in Touch</h3>
          <ul class="footer-contact" style="color:var(--color-text);" id="contactPageInfo">
            <li class="skeleton" style="height:14px;width:150px;margin-bottom:8px;"></li>
            <li class="skeleton" style="height:14px;width:170px;margin-bottom:8px;"></li>
            <li class="skeleton" style="height:14px;width:130px;margin-bottom:8px;"></li>
            <li class="skeleton" style="height:14px;width:200px;"></li>
          </ul>
        </div>
        <div class="card" style="padding:26px;">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">Business Hours</h3>
          <p class="body-text" id="contactPageHours">Loading...</p>
        </div>
      </div>
    </div>
    <div id="contactMapWrap" style="margin-top:24px;"></div>
  </div>
</main>
<div id="sbh-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script>SBHComponents.init('');</script>
<script type="module">
import { loadContactSettings } from "/js/store-settings.js";
const s = await loadContactSettings();
const rows = [];
if (s.phone) rows.push(`<li>📞 ${s.phone}</li>`);
if (s.whatsapp) rows.push(`<li>💬 WhatsApp: ${s.whatsapp}</li>`);
if (s.email) rows.push(`<li>✉️ ${s.email}</li>`);
if (s.address) rows.push(`<li>📍 ${s.address}</li>`);
document.getElementById('contactPageInfo').innerHTML = rows.length ? rows.join('') : `<li class="text-muted">Contact details coming soon — check back shortly.</li>`;
document.getElementById('contactPageHours').textContent = s.hours || 'Business hours coming soon.';

if (s.mapsUrl) {
  document.getElementById('contactMapWrap').innerHTML = `
    <div class="card" style="padding:8px;overflow:hidden;">
      <iframe src="${s.mapsUrl}" width="100%" height="340" style="border:0;border-radius:10px;display:block;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Store location map"></iframe>
    </div>`;
}
</script>
</body>
</html>
