<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>
<main class="auth-wrap">
  <div class="card auth-card" id="fpCard">
    <h1 class="section-heading" style="font-size:22px;margin-bottom:6px;">Reset Password</h1>
    <p class="text-muted" style="margin-bottom:22px;">Enter your email and we'll send you a link to reset your password.</p>
    <form onsubmit="event.preventDefault(); document.getElementById('fpForm').classList.add('hidden'); document.getElementById('fpSuccess').classList.remove('hidden');">
      <div class="form-group" id="fpForm"><label class="form-label">Email Address</label><input required type="email" class="form-input" placeholder="you@example.com" />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Send Reset Link</button>
      </div>
    </form>
    <div class="empty-state hidden" id="fpSuccess" style="padding:20px 0;">
      <div class="icon-wrap" style="background:var(--color-success-bg);color:var(--color-success);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3 style="font-size:15px;">Check your email</h3>
      <p style="font-size:13px;">We've sent a password reset link to your email address.</p>
    </div>
    <p class="text-muted" style="text-align:center;margin-top:20px;font-size:13.5px;"><a href="/login.html" style="color:var(--color-accent);font-weight:600;">← Back to Login</a></p>
  </div>
</main>
<div id="sbh-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script>SBHComponents.init('');</script>
</body>
</html>
