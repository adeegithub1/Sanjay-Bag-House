<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1 class="section-heading" style="font-size:22px;margin-bottom:6px;">Welcome Back</h1>
    <p class="text-muted" style="margin-bottom:22px;">Log in to your Sanjay Bag House account.</p>
    <form id="loginForm">
      <div class="form-group"><label class="form-label">Email Address</label><input required id="loginEmail" type="email" class="form-input" placeholder="you@example.com" /></div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input required id="loginPassword" type="password" class="form-input" placeholder="Enter your password" />
        <div style="text-align:right;margin-top:8px;"><a href="/forgot-password.html" class="caption-text" style="color:var(--color-accent);font-weight:600;">Forgot Password?</a></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
    </form>
    <p class="text-muted" style="text-align:center;margin-top:20px;font-size:13.5px;">New here? <a href="/register.html" style="color:var(--color-accent);font-weight:600;">Create an account</a></p>
  </div>
</main>
<div id="sbh-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script>SBHComponents.init('');</script>
<script type="module">
  import SBHAuth from "/js/auth.js";

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      await SBHAuth.login(email, password);
      showToast('Logged in successfully', 'success');
      // Redirect back to wherever they came from, or /account.html by default
      const next = new URLSearchParams(location.search).get('next') || '/account.html';
      setTimeout(() => window.location.href = next, 500);
    } catch (err) {
      showToast(friendlyAuthError(err), 'error');
      btn.disabled = false; btn.textContent = 'Login';
    }
  });
</script>
</body>
</html>
