<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container">
  <div id="successWrap"></div>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script type="module">
import SBHAuth from "/js/auth.js";
import { db } from "/js/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

SBHComponents.init('');
const data = window.SBH_DATA;

function formatDate(ts) {
  return ts?.toDate ? ts.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
}

const wrap = document.getElementById('successWrap');
const orderId = new URLSearchParams(window.location.search).get('orderId');

function renderFallback() {
  wrap.innerHTML = `
    <div class="empty-state">
      <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
      <h3>We couldn't find that order</h3>
      <p>The order link looks incomplete or has expired. Your order may still have gone through — check your account's order history.</p>
      <div class="flex gap-8" style="justify-content:center;flex-wrap:wrap;">
        <a href="/account/orders.html" class="btn btn-secondary">View My Orders</a>
        <a href="/shop.html" class="btn btn-primary">Continue Shopping</a>
      </div>
    </div>`;
}

if (!orderId) {
  renderFallback();
} else {
  const user = await SBHAuth.getCurrentUser();
  let snap = null;
  try { snap = await getDoc(doc(db, "orders", orderId)); } catch (e) { snap = null; }

  if (!snap || !snap.exists() || (user && snap.data().userId !== user.uid)) {
    renderFallback();
  } else {
    const o = { id: snap.id, ...snap.data() };
    const shortId = '#' + o.id.slice(0, 8).toUpperCase();

    wrap.innerHTML = `
    <div class="empty-state" style="padding-top:36px;">
      <div class="icon-wrap" style="background:var(--color-success-bg);color:var(--color-success);">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h3>Order Placed Successfully!</h3>
      <p>Thank you for shopping with Sanjay Bag House. We've received your order and will get it packed and shipped shortly. You'll pay by Cash on Delivery when it arrives.</p>
      <p class="caption-text" style="margin-bottom:20px;">Order ${shortId} · Placed on ${formatDate(o.createdAt)}</p>

      <div class="card" style="max-width:480px;margin:0 auto 22px;text-align:left;padding:22px;">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:14px;">Order Summary</h3>
        ${(o.items || []).map(i => `
          <div class="summary-row"><span>${i.name} × ${i.qty}</span><span>${data.formatINR(i.lineTotal || i.price * i.qty)}</span></div>
        `).join('')}
        <div class="summary-row"><span>Subtotal</span><span>${data.formatINR(o.subtotal)}</span></div>
        ${o.discount ? `<div class="summary-row"><span>Discount${o.couponCode ? ` (${o.couponCode})` : ''}</span><span style="color:var(--color-success);">− ${data.formatINR(o.discount)}</span></div>` : ''}
        <div class="summary-row"><span>Shipping</span><span>${o.shipping === 0 ? 'FREE' : data.formatINR(o.shipping)}</span></div>
        ${o.codFee ? `<div class="summary-row"><span>COD Fee</span><span>${data.formatINR(o.codFee)}</span></div>` : ''}
        <div class="summary-row total"><span>Total</span><span>${data.formatINR(o.total)}</span></div>
      </div>

      <div class="flex gap-8" style="justify-content:center;flex-wrap:wrap;">
        <a href="/account/order-detail.html?id=${encodeURIComponent(o.id)}" class="btn btn-secondary">View Order Details</a>
        <a href="/shop.html" class="btn btn-primary">Continue Shopping</a>
      </div>
    </div>`;
  }
}
</script>
</body>
</html>
