<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Product | Sanjay Bag House</title>
<meta name="description" id="pageDesc" content="Shop premium bags at Sanjay Bag House." />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container">
  <nav class="breadcrumb" id="breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><a href="/shop.html">Shop</a></nav>

  <div class="pdp-grid" id="pdpRoot"></div>

  <div class="tabs" id="pdpTabs">
    <button class="tab-btn active" data-tab="description">Description</button>
    <button class="tab-btn" data-tab="specs">Specifications</button>
    <button class="tab-btn" data-tab="shipping">Shipping &amp; Returns</button>
    <button class="tab-btn" data-tab="reviews">Reviews</button>
  </div>
  <div id="tabPanels"></div>

  <section class="section" style="padding-top:10px;">
    <div class="section-head"><h2 class="section-heading">You May Also Like</h2></div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script src="/js/product-card.js"></script>
<script type="module" src="/js/firebase-data.js"></script>
<script type="module">
(async () => {
SBHComponents.init('shop');
const data = await window.SBH_FIRESTORE.load();
const slug = new URLSearchParams(window.location.search).get('slug');
const p = data.getProduct(slug) || data.PRODUCTS[0];
let qty = 1;

document.title = p.name + " | Sanjay Bag House";
document.getElementById('pageTitle').textContent = p.name + " | Sanjay Bag House";
document.getElementById('pageDesc').setAttribute('content', p.desc);
const cat = data.getCategory(p.category);
document.getElementById('breadcrumb').innerHTML += `<span class="sep">/</span><a href="/category.html?slug=${p.category}">${cat ? cat.name : p.category}</a><span class="sep">/</span><span class="current">${p.name}</span>`;

const { loadShippingSettings, loadBrandingSettings } = await import("/js/store-settings.js");
const shippingSettings = await loadShippingSettings();
const brandingSettings = await loadBrandingSettings();
const storeDisplayName = brandingSettings.storeName || "Sanjay Bag House";

function stars(rating) { const full = Math.round(rating); return "★★★★★☆☆☆☆☆".slice(5 - full, 10 - full); }

function renderPDP() {
  const wished = window.SBHStore.isWishlisted(p.id);
  const disc = data.discountPct(p.mrp, p.price);
  document.getElementById('pdpRoot').innerHTML = `
    <div>
      <div class="pdp-gallery-main">
        <img src="${p.images[0]}" alt="${p.name}" id="mainImg" />
        <button class="zoom-btn" aria-label="Zoom image" onclick="openImageZoom()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
        </button>
      </div>
      <div class="pdp-thumbs" id="thumbRow">
        ${p.images.map((img,i) => `<div class="pdp-thumb ${i===0?'active':''}" onclick="setImg(${i})"><img src="${img}" alt="thumbnail ${i+1}"/></div>`).join('')}
      </div>
    </div>
    <div class="pdp-info">
      <a class="brand-link" href="/shop.html">${p.brand}</a>
      <h1>${p.name}</h1>
      <div class="pdp-meta-row">
        <span class="pdp-rating"><span class="stars">${stars(p.rating)}</span> ${p.rating} (${p.reviews} reviews)</span>
        <span class="caption-text">SKU: ${p.sku}</span>
      </div>
      <div class="pdp-price-block">
        <span class="selling">${data.formatINR(p.price)}</span>
        <span class="mrp">${data.formatINR(p.mrp)}</span>
        <span class="discount">${disc}% OFF</span>
      </div>
      <p class="tax-note">Inclusive of all taxes</p>
      <div id="pdpCouponStrip"></div>
      <p style="margin-bottom:16px;">${p.stock > 0 ? (p.stock < 15 ? `<span class="badge badge-warning">Only ${p.stock} left in stock</span>` : `<span class="badge badge-success">In Stock</span>`) : `<span class="badge badge-danger">Out of Stock</span>`}</p>

      <div class="form-label">Quantity</div>
      <div class="qty-selector">
        <button onclick="changeQty(-1)" aria-label="Decrease quantity">−</button>
        <span id="qtyVal">1</span>
        <button onclick="changeQty(1)" aria-label="Increase quantity">+</button>
      </div>

      <div class="pdp-actions">
        <button class="btn btn-secondary" ${p.stock<=0?'disabled':''} onclick="addToCartPDP()">Add to Cart</button>
        <button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="buyNowPDP()">Buy Now</button>
        <button class="btn btn-icon btn-ghost" aria-label="Toggle wishlist" onclick="toggleWishlistPDP()" id="pdpWishBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${wished?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6Z"/></svg>
        </button>
      </div>

      <div class="pdp-sticky-bar">
        <button class="btn btn-secondary" ${p.stock<=0?'disabled':''} onclick="addToCartPDP()">Add to Cart</button>
        <button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="buyNowPDP()">Buy Now</button>
      </div>

      <div class="card" style="padding:16px;margin-bottom:18px;">
        <div class="form-label" style="margin-bottom:8px;">Check Delivery &amp; COD Availability</div>
        <div class="flex gap-8">
          <input type="text" id="pincodeInput" class="form-input" placeholder="Enter 6-digit pincode" maxlength="6" style="max-width:180px;" />
          <button class="btn btn-secondary btn-sm" onclick="checkPincode()">Check</button>
        </div>
        <div id="pincodeResult" style="margin-top:10px;"></div>
      </div>

      <div class="trust-strip">
        <span class="trust-item">🚚 Free shipping above ${data.formatINR(shippingSettings.freeThreshold)}</span>
        ${shippingSettings.codEnabled ? '<span class="trust-item">💵 Cash on Delivery available</span>' : ''}
        <span class="trust-item">↩ 7-day easy returns</span>
        <span class="trust-item">✅ 100% Genuine Product</span>
        <span class="trust-item">🔒 Secure payment</span>
      </div>
      <p class="caption-text" style="margin-top:8px;">Sold by <strong>${storeDisplayName}</strong></p>
    </div>
  `;
}

window.checkPincode = function() {
  const val = document.getElementById('pincodeInput').value.trim();
  const result = document.getElementById('pincodeResult');
  if (!/^[1-9][0-9]{5}$/.test(val)) {
    result.innerHTML = `<p class="form-error">Please enter a valid 6-digit pincode.</p>`;
    return;
  }
  const today = new Date();
  const fast = new Date(today); fast.setDate(today.getDate() + 4);
  const slow = new Date(today); slow.setDate(today.getDate() + 7);
  const fmt = (d) => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  result.innerHTML = `
    <p class="body-text" style="margin-bottom:4px;">✅ Delivery available to <strong>${val}</strong></p>
    <p class="caption-text">Usually arrives between <strong>${fmt(fast)} – ${fmt(slow)}</strong></p>
    ${shippingSettings.codEnabled ? '<p class="caption-text" style="color:var(--color-success);">Cash on Delivery available for this pincode</p>' : ''}
  `;
};

window.setImg = function(i){ document.getElementById('mainImg').src = p.images[i]; document.querySelectorAll('.pdp-thumb').forEach((t,idx)=>t.classList.toggle('active', idx===i)); };

window.openImageZoom = function() {
  const currentSrc = document.getElementById('mainImg').src;
  let modal = document.getElementById('imageZoomModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'imageZoomModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(14,27,52,0.92);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;';
    modal.innerHTML = `
      <button aria-label="Close" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <img id="zoomedImg" src="" alt="${p.name}" style="max-width:92%;max-height:90vh;object-fit:contain;border-radius:8px;cursor:default;" />`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('button')) closeImageZoom(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageZoom(); });
  }
  document.getElementById('zoomedImg').src = currentSrc;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
};
window.closeImageZoom = function() {
  const modal = document.getElementById('imageZoomModal');
  if (modal) modal.style.display = 'none';
  document.body.style.overflow = '';
};
window.changeQty = function(d){ qty = Math.max(1, Math.min(p.stock, qty+d)); document.getElementById('qtyVal').textContent = qty; };
window.addToCartPDP = function(){ window.SBHStore.addToCart(p.id, qty); showToast('Product added to cart','success'); };
window.buyNowPDP = function(){ window.SBHStore.addToCart(p.id, qty); window.location.href = '/checkout.html'; };
window.toggleWishlistPDP = function(){
  const added = window.SBHStore.toggleWishlist(p.id);
  showToast(added?'Added to wishlist':'Removed from wishlist', added?'success':'default');
  renderPDP();
};

async function renderTabs() {
  document.getElementById('tabPanels').innerHTML = `
    <div class="tab-panel active" data-panel="description">
      <p class="body-text" style="max-width:760px;">${p.desc}</p>
      <ul style="margin-top:16px;padding-left:18px;list-style:disc;color:var(--color-muted);font-size:13.5px;line-height:1.9;">
        <li>Premium ${p.material.toLowerCase()} construction</li>
        <li>Reinforced stitching at stress points</li>
        <li>Ergonomic, padded straps for all-day comfort</li>
        <li>${p.warranty}</li>
      </ul>
    </div>
    <div class="tab-panel" data-panel="specs">
      <table class="spec-table">
        <tr><td>Material</td><td>${p.material}</td></tr>
        <tr><td>Color</td><td>${p.color}</td></tr>
        <tr><td>Dimensions</td><td>${p.dimensions}</td></tr>
        <tr><td>Weight</td><td>${p.weight}</td></tr>
        <tr><td>Warranty</td><td>${p.warranty}</td></tr>
        <tr><td>Care Instructions</td><td>Wipe with a clean, dry cloth. Avoid prolonged exposure to direct sunlight and moisture.</td></tr>
      </table>
    </div>
    <div class="tab-panel" data-panel="shipping">
      <p class="body-text" style="margin-bottom:12px;"><strong>Shipping:</strong> Orders are dispatched within 1-2 business days and typically delivered within 4-7 business days across India.</p>
      <p class="body-text"><strong>Returns:</strong> This item is eligible for return or exchange within 7 days of delivery, provided it is unused and in original packaging. <a href="/return-policy.html" style="color:var(--color-accent);font-weight:600;">Read full return policy →</a></p>
    </div>
    <div class="tab-panel" data-panel="reviews">
      <div id="ratingBreakdown" style="margin-bottom:20px;"></div>
      <div id="reviewFormWrap" style="margin-bottom:24px;"></div>
      <div id="reviewsList"></div>
    </div>
  `;

  // ---- Real reviews (Firestore) ----
  const { db } = await import("/js/firebase-init.js");
  const { collection, query, where, getDocs, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
  const SBHAuthMod = (await import("/js/auth.js")).default;

  async function loadReviews() {
    const q = query(collection(db, "reviews"), where("productId", "==", p.id), where("status", "==", "approved"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  const list = document.getElementById('reviewsList');
  const realReviews = await loadReviews();

  // Rating breakdown (computed from real approved reviews only)
  const breakdownEl = document.getElementById('ratingBreakdown');
  if (realReviews.length) {
    const counts = [5,4,3,2,1].map(star => realReviews.filter(r => Math.round(r.rating) === star).length);
    const avg = (realReviews.reduce((s,r)=>s+r.rating,0) / realReviews.length).toFixed(1);
    breakdownEl.innerHTML = `
      <div class="flex items-center gap-8" style="margin-bottom:14px;">
        <span style="font-size:28px;font-weight:800;">${avg}</span>
        <div><span class="stars" style="color:var(--color-star);font-size:16px;">${stars(avg)}</span><div class="caption-text">${realReviews.length} review${realReviews.length===1?'':'s'}</div></div>
      </div>
      ${[5,4,3,2,1].map((star,i) => {
        const pct = Math.round((counts[i] / realReviews.length) * 100);
        return `<div class="flex items-center gap-8" style="margin-bottom:4px;">
          <span class="caption-text" style="width:36px;">${star} ★</span>
          <div style="flex:1;height:7px;background:var(--color-border);border-radius:4px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:var(--color-star);"></div></div>
          <span class="caption-text" style="width:28px;text-align:right;">${counts[i]}</span>
        </div>`;
      }).join('')}
    `;
  }

  if (realReviews.length) {
    list.innerHTML = realReviews.map(r => `
      <div style="padding:18px 0;border-bottom:1px solid var(--color-border);">
        <div class="flex items-center gap-8" style="margin-bottom:6px;">
          <span class="stars" style="color:var(--color-star);">${stars(r.rating)}</span>
          <strong style="font-size:13.5px;">${r.customerName || 'Customer'}</strong>
          ${r.verifiedPurchase ? '<span class="badge badge-success">Verified Purchase</span>' : ''}
        </div>
        <p class="body-text" style="margin-bottom:4px;">${r.text}</p>
        <span class="caption-text">${r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : ''}</span>
      </div>`).join('');
  } else {
    list.innerHTML = `<p class="text-muted">No reviews yet for this product. Be the first to review it after your purchase.</p>`;
  }

  // Review submission form (signed-in users only)
  const currentUser = await SBHAuthMod.getCurrentUser();
  const formWrap = document.getElementById('reviewFormWrap');
  if (currentUser) {
    formWrap.innerHTML = `
      <div class="card" style="padding:18px;">
        <h4 style="font-size:13.5px;font-weight:700;margin-bottom:12px;">Write a Review</h4>
        <div class="form-group">
          <label class="form-label">Your Rating</label>
          <select id="reviewRatingInput" class="form-select" style="max-width:160px;">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option>
            <option value="2">★★☆☆☆ (2)</option>
            <option value="1">★☆☆☆☆ (1)</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Your Review</label><textarea id="reviewTextInput" class="form-textarea" placeholder="Share your experience with this product..."></textarea></div>
        <button class="btn btn-primary btn-sm" id="submitReviewBtn">Submit Review</button>
        <p class="caption-text" style="margin-top:8px;">Your review will be visible after admin approval.</p>
      </div>`;
    document.getElementById('submitReviewBtn').addEventListener('click', async () => {
      const text = document.getElementById('reviewTextInput').value.trim();
      const rating = Number(document.getElementById('reviewRatingInput').value);
      if (!text) { showToast('Please write something before submitting.', 'error'); return; }
      const btn = document.getElementById('submitReviewBtn');
      btn.disabled = true; btn.textContent = 'Submitting...';
      try {
        const profile = await SBHAuthMod.getCustomerProfile(currentUser.uid);
        let verifiedPurchase = false;
        try {
          const ownOrdersQ = query(collection(db, "orders"), where("userId", "==", currentUser.uid));
          const ownOrdersSnap = await getDocs(ownOrdersQ);
          verifiedPurchase = ownOrdersSnap.docs.some(d => (d.data().items || []).some(i => i.productId === p.id));
        } catch (e) { /* verification best-effort; defaults to false if it fails */ }
        await addDoc(collection(db, "reviews"), {
          productId: p.id,
          userId: currentUser.uid,
          customerName: profile?.name || currentUser.displayName || 'Customer',
          rating, text,
          verifiedPurchase,
          status: 'pending',
          createdAt: serverTimestamp(),
        });
        showToast('Review submitted — pending approval. Thank you!', 'success');
        formWrap.innerHTML = `<p class="caption-text">Thanks for your review — it'll appear here once approved.</p>`;
      } catch (err) {
        showToast('Could not submit review. Please try again.', 'error');
        btn.disabled = false; btn.textContent = 'Submit Review';
      }
    });
  } else {
    formWrap.innerHTML = `<p class="caption-text"><a href="/login.html?next=${encodeURIComponent(location.pathname+location.search)}" style="color:var(--color-accent);font-weight:600;">Log in</a> to write a review.</p>`;
  }


  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(pnl=>pnl.classList.remove('active'));
      this.classList.add('active');
      document.querySelector(`.tab-panel[data-panel="${this.dataset.tab}"]`).classList.add('active');
    });
  });
}

renderPDP();
await renderTabs();
document.getElementById('relatedGrid').innerHTML = data.getRelated(p).map(rp => renderProductCard(rp)).join('');

// Real active coupons (not fabricated) — pulled straight from Firestore
try {
  const { db } = await import("/js/firebase-init.js");
  const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
  const snap = await getDocs(collection(db, "coupons"));
  const today = new Date().toISOString().slice(0,10);
  const activeCoupons = snap.docs.map(d => ({ code: d.id, ...d.data() }))
    .filter(c => c.active && (!c.end || today <= c.end) && (!c.start || today >= c.start))
    .slice(0, 3);
  const stripEl = document.getElementById('pdpCouponStrip');
  if (stripEl && activeCoupons.length) {
    stripEl.innerHTML = `
      <div style="margin:12px 0;">
        ${activeCoupons.map(c => `
          <div style="display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--color-accent);border-radius:8px;padding:8px 12px;margin-bottom:6px;background:var(--color-danger-bg);">
            <span style="font-size:12.5px;"><strong>${c.code}</strong> — ${c.type === 'Percentage' ? c.value + '% off' : data.formatINR(c.value) + ' off'}${c.minOrder ? ` on orders above ${data.formatINR(c.minOrder)}` : ''}</span>
          </div>`).join('')}
      </div>`;
  }
} catch (e) { /* no coupons to show */ }

})();
</script>
</body>
</html>
