<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1 class="section-heading" style="font-size:22px;margin-bottom:6px;">Create Account</h1>
    <p class="text-muted" style="margin-bottom:22px;">Join Sanjay Bag House for faster checkout and order tracking.</p>
    <form onsubmit="event.preventDefault(); showToast('Account created successfully','success'); setTimeout(()=>window.location.href='/account.html',700);">
      <div class="form-group"><label class="form-label">Full Name</label><input required class="form-input" placeholder="Your full name" /></div>
      <div class="form-group"><label class="form-label">Email Address</label><input required type="email" class="form-input" placeholder="you@example.com" /></div>
      <div class="form-group"><label class="form-label">Mobile Number</label><input required type="tel" class="form-input" placeholder="10-digit mobile number" /></div>
      <div class="form-group"><label class="form-label">Password</label><input required type="password" class="form-input" placeholder="Create a password" /></div>
      <label class="checkbox-row" style="margin-bottom:18px;"><input type="checkbox" required /> I agree to the <a href="/terms.html" style="color:var(--color-accent);">Terms &amp; Conditions</a></label>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="text-muted" style="text-align:center;margin-top:20px;font-size:13.5px;">Already have an account? <a href="/login.html" style="color:var(--color-accent);font-weight:600;">Login</a></p>
  </div>
</main>
<div id="sbh-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script>SBHComponents.init('');</script>
</body>
</html>
