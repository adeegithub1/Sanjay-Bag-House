<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search Results | Sanjay Bag House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container">
  <nav class="breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><span class="current">Search</span></nav>
  <h1 class="section-heading">Search Results for "<span id="queryText"></span>"</h1>

  <div class="shop-toolbar">
    <p class="text-muted" id="searchCount"></p>
    <select id="searchSort" class="form-select" style="width:auto;">
      <option value="featured">Featured</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
      <option value="rating">Rating</option>
    </select>
  </div>

  <div class="product-grid" id="searchGrid"></div>

  <div class="empty-state hidden" id="searchEmpty">
    <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
    <h3>No results found</h3>
    <p>We couldn't find anything matching your search. Try a different keyword like "backpack" or "trolley".</p>
    <a href="/shop.html" class="btn btn-primary">Browse All Bags</a>
  </div>
</main>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script src="/js/product-card.js"></script>
<script>
SBHComponents.init('shop');
const data = window.SBH_DATA;
const q = (new URLSearchParams(window.location.search).get('q') || '').toLowerCase().trim();
document.getElementById('queryText').textContent = q;

let sortMode = 'featured';
function renderSearch() {
  let list = q ? data.PRODUCTS.filter(p => (p.name + ' ' + p.category + ' ' + p.brand + ' ' + p.color).toLowerCase().includes(q)) : [];
  document.getElementById('searchCount').textContent = `${list.length} results found`;
  switch(sortMode) {
    case 'price-low': list = list.slice().sort((a,b)=>a.price-b.price); break;
    case 'price-high': list = list.slice().sort((a,b)=>b.price-a.price); break;
    case 'rating': list = list.slice().sort((a,b)=>b.rating-a.rating); break;
  }
  document.getElementById('searchGrid').innerHTML = list.map(p => renderProductCard(p)).join('');
  document.getElementById('searchEmpty').classList.toggle('hidden', list.length > 0);
}
document.getElementById('searchSort').addEventListener('change', function(){ sortMode = this.value; renderSearch(); });
renderSearch();
</script>
</body>
</html>
