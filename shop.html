<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Bags | Sanjay Bag House</title>
<meta name="description" content="Browse the full Sanjay Bag House catalogue — backpacks, laptop bags, travel bags, trolley bags, ladies bags and more." />
<link rel="canonical" href="https://sanjaybaghouse.in/shop.html" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="sbh-header"></div>

<main class="container">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/index.html">Home</a><span class="sep">/</span><span class="current">Shop</span></nav>
  <h1 class="section-heading" style="margin-bottom:4px;">Shop All Bags</h1>
  <p class="text-muted" id="resultCount" style="margin-bottom:10px;">Loading products…</p>

  <div class="shop-layout">
    <!-- Desktop sidebar filters -->
    <aside id="filterSidebarDesktop" style="display:none;">
      <div id="filterContent"></div>
    </aside>

    <div>
      <div class="shop-toolbar">
        <button class="btn btn-ghost btn-sm mobile-filter-btn" onclick="openFilterDrawer()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters
        </button>
        <div class="flex items-center gap-8">
          <label class="caption-text" for="sortSelect">Sort by</label>
          <select id="sortSelect" class="form-select" style="width:auto;">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="popularity">Popularity</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>

      <div class="product-grid" id="shopGrid"></div>
      <div class="empty-state hidden" id="shopEmpty">
        <div class="icon-wrap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
        <h3>No products found</h3>
        <p>Try adjusting your filters or search for something else.</p>
        <button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<!-- Mobile filter drawer -->
<div class="drawer-overlay" id="filterDrawerOverlay" onclick="closeFilterDrawer()"></div>
<div class="drawer drawer-right" id="filterDrawer">
  <div class="drawer-header">
    <strong>Filters</strong>
    <button class="icon-btn" onclick="closeFilterDrawer()" aria-label="Close filters">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" style="padding:18px;" id="filterContentMobile"></div>
  <div style="padding:16px 18px;border-top:1px solid var(--color-border);">
    <button class="btn btn-primary btn-block" onclick="closeFilterDrawer()">Show Results</button>
  </div>
</div>

<div id="sbh-footer"></div>

<script src="/js/data.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script src="/js/product-card.js"></script>
<script type="module" src="/js/firebase-data.js"></script>
<script type="module">
(async () => {
SBHComponents.init('shop');
const data = await window.SBH_FIRESTORE.load();
let state = { categories: [], price: 6000, sort: 'featured', rating: 0, page: 1 };
const PAGE_SIZE = 8;

function filterHTML() {
  const cats = data.CATEGORIES.map(c => `
    <label class="filter-option"><input type="checkbox" value="${c.id}" onchange="toggleCategory('${c.id}')" ${state.categories.includes(c.id) ? 'checked' : ''}/> ${c.name} <span class="text-muted">(${c.count})</span></label>`).join('');
  return `
  <div class="filter-block">
    <h4>Category</h4>
    ${cats}
  </div>
  <div class="filter-block">
    <h4>Price</h4>
    <input type="range" min="500" max="6000" step="100" value="${state.price}" oninput="setPrice(this.value)" style="width:100%;accent-color:var(--color-accent);" />
    <div class="flex justify-between caption-text mt-8"><span>₹500</span><span id="priceVal">Up to ₹${state.price}</span></div>
  </div>
  <div class="filter-block">
    <h4>Brand</h4>
    <label class="filter-option"><input type="checkbox" checked disabled/> Sanjay Bag House</label>
  </div>
  <div class="filter-block">
    <h4>Color</h4>
    <div class="flex gap-8" style="flex-wrap:wrap;">
      <span class="filter-color-swatch" style="background:#171717;" title="Black"></span>
      <span class="filter-color-swatch" style="background:#8A5A3B;" title="Tan"></span>
      <span class="filter-color-swatch" style="background:#2C3E6B;" title="Navy"></span>
      <span class="filter-color-swatch" style="background:#5B6E4F;" title="Olive"></span>
      <span class="filter-color-swatch" style="background:#C62828;" title="Red"></span>
    </div>
  </div>
  <div class="filter-block">
    <h4>Availability</h4>
    <label class="filter-option"><input type="checkbox" onchange="state.inStock=this.checked;render();"/> In Stock Only</label>
  </div>
  <div class="filter-block" style="border-bottom:none;">
    <h4>Rating</h4>
    ${[4,3,2].map(r => `<label class="filter-option"><input type="radio" name="rating" onchange="state.rating=${r};render();"/> ${'★'.repeat(r)}${'☆'.repeat(5-r)} &amp; Up</label>`).join('')}
  </div>
  <button class="btn btn-ghost btn-block" onclick="resetFilters()">Reset Filters</button>
  `;
}

function toggleCategory(id) {
  const i = state.categories.indexOf(id);
  if (i >= 0) state.categories.splice(i,1); else state.categories.push(id);
  state.page = 1; render();
}
function setPrice(v) { state.price = Number(v); state.page = 1; render(); }
function resetFilters() { state = { categories: [], price: 6000, sort: 'featured', rating: 0, page: 1 }; document.getElementById('sortSelect').value='featured'; render(); }

function openFilterDrawer(){ document.getElementById('filterDrawer').classList.add('open'); document.getElementById('filterDrawerOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeFilterDrawer(){ document.getElementById('filterDrawer').classList.remove('open'); document.getElementById('filterDrawerOverlay').classList.remove('open'); document.body.style.overflow=''; }

function getFiltered() {
  let list = data.PRODUCTS.slice();
  if (state.categories.length) list = list.filter(p => state.categories.includes(p.category));
  list = list.filter(p => p.price <= state.price);
  if (state.rating) list = list.filter(p => p.rating >= state.rating);
  if (state.inStock) list = list.filter(p => p.stock > 0);
  switch (state.sort) {
    case 'newest': list = list.filter(p=>p.newArrival).concat(list.filter(p=>!p.newArrival)); break;
    case 'price-low': list.sort((a,b) => a.price - b.price); break;
    case 'price-high': list.sort((a,b) => b.price - a.price); break;
    case 'popularity': list.sort((a,b) => b.reviews - a.reviews); break;
    case 'rating': list.sort((a,b) => b.rating - a.rating); break;
    default: list.sort((a,b) => (b.featured?1:0) - (a.featured?1:0));
  }
  return list;
}

function render() {
  document.getElementById('filterContent').innerHTML = filterHTML();
  document.getElementById('filterContentMobile').innerHTML = filterHTML();
  const filtered = getFiltered();
  document.getElementById('resultCount').textContent = `${filtered.length} products found`;
  const start = (state.page - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  document.getElementById('shopGrid').innerHTML = pageItems.map(p => renderProductCard(p)).join('');
  document.getElementById('shopEmpty').classList.toggle('hidden', filtered.length > 0);
  document.getElementById('filterSidebarDesktop').style.display = 'block';

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  let pagHtml = '';
  for (let i = 1; i <= totalPages; i++) {
    pagHtml += `<button class="page-btn ${i===state.page?'active':''}" onclick="state.page=${i};render();window.scrollTo({top:0,behavior:'smooth'})">${i}</button>`;
  }
  document.getElementById('pagination').innerHTML = totalPages > 1 ? pagHtml : '';
}

document.getElementById('sortSelect').addEventListener('change', function(){ state.sort = this.value; render(); });

// Deep-link support from category page / URL params
const params = new URLSearchParams(window.location.search);
if (params.get('sort')) { state.sort = params.get('sort'); }
render();
})();
</script>
</body>
</html>
